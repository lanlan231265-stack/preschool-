<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<title>非營利幼兒園法規通 | 園所人員法規速查平台</title>
<style>
  :root{
    --navy:#0f2942;
    --navy-deep:#0a1c2e;
    --teal:#1d6f6a;
    --teal-light:#2e938c;
    --mint:#a8ddd4;
    --mint-pale:#eaf7f4;
    --paper:#f7f9f8;
    --ink:#1c2b30;
    --ink-soft:#4c5f63;
    --line:#dbe6e3;
    --amber:#c8862a;
    --blue:#2f6fed;

  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.7;
  }
  a{color:inherit;}

  /* ---------- Header ---------- */
  header.site{
    background:linear-gradient(135deg,var(--navy-deep),var(--navy) 55%,var(--teal) 130%);
    color:var(--white);
    padding:32px 20px 26px;
    position:relative;
    overflow:hidden;
  }
  header.site::after{
    content:"";
    position:absolute;
    right:-60px;top:-60px;
    width:260px;height:260px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(168,221,212,0.28),transparent 70%);
  }
  .header-inner{max-width:1080px;margin:0 auto;position:relative;z-index:1;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12.5px;letter-spacing:.12em;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.25);
    padding:5px 12px;border-radius:999px;
    margin-bottom:14px;
  }
  h1.site-title{font-size:26px;margin:0 0 8px;font-weight:700;letter-spacing:.02em;}
  .site-sub{font-size:14px;color:var(--mint);opacity:.92;max-width:640px;}
  .scope-note{
    margin-top:16px;font-size:12.5px;color:rgba(255,255,255,.75);
    border-left:3px solid var(--mint);padding-left:10px;
  }

  /* ---------- Tabs ---------- */
  nav.tabbar{
    position:sticky;top:0;z-index:50;
    background:var(--white);
    border-bottom:1px solid var(--line);
    box-shadow:0 2px 10px rgba(15,41,66,.06);
  }
  .tabbar-inner{max-width:1080px;margin:0 auto;display:flex;}
  .tab-btn{
    flex:1;
    padding:14px 8px;
    text-align:center;
    font-size:14.5px;
    font-weight:700;
    color:var(--ink-soft);
    background:none;border:none;cursor:pointer;
    border-bottom:3px solid transparent;
    transition:all .15s ease;
  }
  .tab-btn.active{color:var(--navy);border-bottom-color:var(--teal);background:var(--mint-pale);}
  .tab-btn:hover{color:var(--teal);}

  main{max-width:1080px;margin:0 auto;padding:22px 16px 70px;}
  section.view{display:none;}
  section.view.active{display:block;}

  /* ---------- Search ---------- */
  .search-wrap{
    display:flex;gap:10px;margin-bottom:16px;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 14px;
    box-shadow:0 1px 3px rgba(15,41,66,.05);
  }
  .search-wrap input{
    flex:1;border:none;outline:none;font-size:15px;
    font-family:inherit;background:transparent;color:var(--ink);
  }
  .search-icon{color:var(--teal);font-size:16px;}
  .result-count{font-size:12.5px;color:var(--ink-soft);margin:0 2px 14px;}

  /* ---------- Category chips ---------- */
  .cat-scroll{
    display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;
    -webkit-overflow-scrolling:touch;
  }
  .cat-scroll::-webkit-scrollbar{height:5px;}
  .cat-scroll::-webkit-scrollbar-thumb{background:var(--mint);border-radius:4px;}
  .chip-wrap{
    display:flex;flex-wrap:wrap;gap:8px;padding:2px 2px 14px;
  }
  .chip{
    flex:0 0 auto;
    font-size:13px;font-weight:600;
    padding:7px 14px;border-radius:999px;
    border:1px solid var(--line);
    background:var(--white);color:var(--ink-soft);
    cursor:pointer;white-space:nowrap;
    transition:all .15s ease;
  }
  .chip.active{background:var(--teal);border-color:var(--teal);color:#fff;}
  .chip:hover:not(.active){border-color:var(--teal-light);color:var(--teal);}
  .chip .n{opacity:.7;font-weight:400;margin-left:2px;}

  /* ---------- QA cards ---------- */
  .qa-list{display:flex;flex-direction:column;gap:10px;}
  .qa-card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    transition:box-shadow .15s ease;
  }
  .qa-card.open{box-shadow:0 4px 16px rgba(15,41,66,.08);}
  .qa-q{
    display:flex;align-items:flex-start;gap:10px;
    padding:14px 16px;cursor:pointer;
    background:var(--white);

  .qa-q:hover{background:var(--mint-pale);}
  .qa-tag{

  .qa-caret{flex:0 0 auto;color:var(--teal);font-size:13px;transition:transform .2s ease;margin-top:3px;}

  .qa-a{
    display:none;
    padding:0 16px 16px 16px;
    font-size:13.8px;color:var(--ink-soft);
    border-top:1px dashed var(--line);

  .qa-a p{margin:10px 0 0;}
  .qa-card.open .qa-a{display:block;}
  .qa-actions{
    margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;
    justify-content:space-between;gap:8px;
  }
  .qa-actions-btns{display:flex;gap:8px;flex:0 0 auto;}
  .qa-src{
    display:inline-block;font-size:11.5px;
    color:var(--teal);background:var(--mint-pale);
    padding:3px 9px;border-radius:6px;

  /* ---------- Law article view ---------- */

  .art-card{

    padding:14px 16px;
  }
  .art-num{

    background:var(--navy);display:inline-block;
    padding:2px 10px;border-radius:6px;margin-bottom:8px;

  .stat-card{

  .stat-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(15,41,66,.1);}
  .stat-card .num{font-size:26px;font-weight:800;color:var(--navy);}
  .stat-card .lbl{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .stat-card .go{font-size:12px;color:var(--teal);font-weight:700;margin-top:8px;}

  .disclaimer{
    margin-top:24px;font-size:12px;color:var(--ink-soft);

  }

  /* ---------- QA category main menu ---------- */
  .menu-grid{
    display:grid;grid-template-columns:1fr;gap:10px;margin-top:4px;
  }
  @media(min-width:520px){.menu-grid{grid-template-columns:1fr 1fr;}}
  .menu-btn{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--white);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;cursor:pointer;text-align:left;

  .menu-btn:hover{border-color:var(--teal);box-shadow:0 4px 14px rgba(15,41,66,.08);transform:translateY(-1px);}
  .menu-btn .count{

    background:var(--mint-pale);border:1px solid var(--mint);

  .menu-btn.all-btn{

  .menu-btn.all-btn .count{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4);color:#fff;}

  .back-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--white);border:1px solid var(--line);border-radius:10px;
    padding:8px 14px;font-size:13.5px;font-weight:700;color:var(--navy);
    cursor:pointer;margin-bottom:14px;font-family:inherit;
  }
  .back-btn:hover{border-color:var(--teal);color:var(--teal);}

  .copy-btn{
    display:inline-flex;align-items:center;gap:5px;
    background:var(--white);border:1px solid var(--line);border-radius:7px;
    padding:5px 11px;font-size:12px;font-weight:700;color:var(--teal);
    cursor:pointer;font-family:inherit;white-space:nowrap;
  }
  .copy-btn:hover{background:var(--mint-pale);border-color:var(--teal);}
  .copy-btn.copied{background:var(--teal);color:#fff;border-color:var(--teal);}

  .sublaw-link{
    display:inline-block;margin-top:10px;font-size:13px;font-weight:700;
    color:#fff;background:var(--teal);padding:7px 14px;border-radius:8px;
    text-decoration:none;
  }
  .sublaw-link:hover{background:var(--teal-light);}

  /* ---------- QA citation block ---------- */
  .qa-cite{
    margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
  }
  .qa-cite-label{font-weight:700;color:var(--navy);font-size:13px;}
  .cite-item{
    margin-top:6px;background:var(--mint-pale);border:1px solid var(--mint);
    border-radius:8px;padding:8px 10px;
  }
  .cite-law{font-size:12.5px;font-weight:700;color:var(--teal);margin-bottom:3px;}
  .cite-text{font-size:13px;color:var(--ink);white-space:pre-wrap;line-height:1.65;}
  .cite-text strong{color:var(--navy);}

  .empty-state{
    text-align:center;color:var(--ink-soft);font-size:13.5px;padding:40px 10px;
  }

  footer.site{
    text-align:center;font-size:12px;color:var(--ink-soft);
    padding:24px 16px 40px;
  }
</style>

<script>
/* ============================================================
   QA 資料（依教育部國教署 115年4月Q&A 及非營利幼兒園實施辦法彙整摘編）
   ============================================================ */
const QA = [
// ---- 基本觀念與定義 ----
{cat:"基本觀念", q:"什麼是「非營利法人」？哪些法人可以辦理非營利幼兒園？", a:"依實施辦法第2條，非營利法人指以下四類：(1)學校財團法人及醫療法人；(2)幼兒教保相關工會組織；(3)依職工福利委員會組織準則設立、已完成法人登記之職工福利委員會；(4)章程載明幼兒與兒童、家庭、教保服務人員福祉、教育或社會福利事務相關事項之財團法人或非營利社團法人。"},
{cat:"基本觀念", q:"非營利幼兒園有哪兩種辦理方式？", a:"一是「委託辦理」：由直轄市縣市政府及所屬機關、中央政府機關、國立各級學校、軍警校院、鄉鎮市公所及直轄市山地原住民區公所、公司組織之公營事業（統稱委託單位）委託非營利法人辦理；二是「申請辦理」：由非營利法人申請經直轄市縣市主管機關核准辦理。"},
{cat:"基本觀念", q:"非營利幼兒園招收幼兒的優先順序為何？", a:"應優先招收「需要協助幼兒」，餘額才招收一般幼兒（辦法第14條）。若為依性別平等工作法第23條第1項第2款所設之托兒設施（機關員工福利型），順序為：①員工子女、孫子女→②需要協助幼兒→③其餘幼兒；同一順序登記人數逾額時，以公開抽籤決定，但同一托兒設施在讀且非當學年度畢業之兄弟姊妹，可於同順位優先招收。"},
// ---- 委託/申請辦理與甄選 ----
{cat:"委託與甄選", q:"非營利法人參加甄選時，經營計畫書應包含哪些事項？", a:"依第9條，應包括：法人名稱；設立緣起、宗旨、登記證書、董（理）監事名冊、組織架構圖、章程及願景；提供之協助；最近二年決算及會計查核流程（新設法人免附）；園之宗旨經營理念與園務發展計畫；法人與園間專業資源整合規劃；人力進用及專業發展規劃；財務管理機制；預期辦理成效；其他相關事項。"},
{cat:"委託與甄選", q:"非營利法人若曾被公告違規，還能再承接非營利幼兒園嗎？", a:"依第9條、第11條，若非營利法人（或其董理事長）因辦法第31條第1項第1至3款、第5款、第32條第1項情事，或職場互助辦法第30條第3項相關款次，累計公告達2次者，不得再接受委託或申請辦理。但「績效考評不通過」已於114年修法排除於此累計事由外，避免因考評結果過度限制法人日後承接資格。"},
{cat:"委託與甄選", q:"委託辦理與申請辦理的契約期間各為多久？", a:"依第12條，委託辦理及申請辦理之契約期間均為4學年；但因契約期間無法銜接學年度者，得延長至屆滿之當學年度結束為止。"},
{cat:"委託與甄選", q:"審議會的組成與任務為何？", a:"中央與地方主管機關均應依本法第9條第6項設「非營利幼兒園審議會」，任務包括：辦理計畫審議、委託甄選或申請審議、收費項目及數額審議、違反規定終止契約之審議等。地方審議會另負政策諮詢等任務。委員應具教保學者專家、勞工、教保服務人員、家長、婦女團體等多元代表，任一性別委員不得少於總數三分之一。"},
// ---- 收退費 ----
{cat:"收退費", q:"非營利幼兒園每月學費如何計算？", a:"以契約期間之總營運成本除以契約月份數，再除以約定招收總人數計算每人每月應繳費用。低收入戶及中低收入戶家庭子女免繳費用；其餘家庭子女繳費不得少於每月應繳費用之70%（特殊情形或中央主管機關另有規定者得調降），差額由政府協助支付。續約園則以續約期間總營運成本先扣除「由前期餘絀處理之人事費」後再行計算。"},
{cat:"收退費", q:"幼兒請假多少天以上可以退費？如何計算？", a:"依第19條第4項，幼兒因故請假並事前辦妥手續，或依法令停課，連續達5日以上（不含例假日），應按幼兒每人每月實際繳交費用，乘以請假或停課日數占當月教保服務總日數之比率退費。中途入園、離園亦按幼兒就讀當日起算，按比率覈實收退費。"},
{cat:"收退費", q:"請假5日的「連續」如何認定？跨月、跨學期怎麼算？", a:"連續請假須為連續5個「教保服務日」（已扣除例假日、國定假日及開學前停止服務5日）。若跨月、跨年，應分別計算並於次月退費；但跨學期者不予列計退費。"},
{cat:"收退費", q:"國定假日、春節連假是否辦理退費？颱風停班停課呢？", a:"營運成本計算已扣除例假日及國定假日，故國定假日、春節連假不辦理退費。颱風停班停課方面：若幼兒已於事前辦妥連續請假5日以上手續，其請假期間內遇颱風停班停課日仍應退費；但若颱風停班停課日是在請假的前一日或次一日（非連續請假範圍內），因屬不可預期，則不予退費。"},
{cat:"收退費", q:"114年（111年8月起）非本國籍幼兒與各胎次每月實際繳交費用是多少？", a:"配合少子女化對策，第1胎每月2,000元、第2胎每月1,000元，第3名以上及低收入戶、中低收入戶家庭子女免繳費用。非本國籍幼兒自111學年度第2學期起，比照該園第1胎幼兒收費數額，差額由政府協助支付。"},
{cat:"收退費", q:"非營利幼兒園收取代收代辦費（含延長照顧服務費）須經什麼程序？", a:"除延長照顧服務費依中央公告之附件基準辦理、免經同意或核准外，其餘代收代辦費用：委託辦理者須提審議會審議並經委託單位同意；申請辦理者須報直轄市縣市主管機關提審議會審議並經核准，方得收取（辦法第19條）。"},
{cat:"收退費", q:"一般延長照顧服務怎麼收費？", a:"一般延長照顧服務指教保服務日下午5時後提供之照顧，開始時間不得早於下午5時。收費採月收（每小時35元 × 每日參加時數 × 當月教保服務日數）或單次收費（每小時50元、每半小時30元）二擇一。低收入戶、中低收入戶、家戶年所得30萬元以下之5足歲幼兒等經濟弱勢對象得減免。"},
{cat:"收退費", q:"延長照顧服務逾時怎麼收費？逾時收費對象是否適用減免？", a:"逾時照顧服務（超過園所自訂延長照顧時間）：每小時50元、每半小時30元，逾時30分鐘內以半小時計、31至60分鐘以1小時計。原延長照顧服務之減免對象僅適用於園所所訂延長照顧時段，逾時時段收費一律比照一般幼生辦理，不適用減免。"},
{cat:"收退費", q:"開學前的「停止服務日」如果有提供照顧服務要收費嗎？", a:"依第15條，每學期開學前得停止服務5日（供環境整理、清潔消毒、課程討論）。若該5日內有應家長需求提供照顧服務，上午8時至下午5時以每日100元計費；逾下午5時之部分比照一般延長照顧及逾時照顧收費原則辦理，此收費應歸屬「延長照顧服務收費」項目。"},
{cat:"收退費", q:"中低收入戶證明文件學期中才取得，可以追溯免費嗎？", a:"低收入戶及中低收入戶身分係採「全學期認定」。園所每學期期初應至幼生系統查調，如需補正證明文件，上學期須於1月15日前、下學期須於7月15日前提供，逾期恐無法追溯適用。"},
// ---- 人事薪資與晉薪 ----
{cat:"人事薪資", q:"哪些人員的薪資有法定支給基準表可循？", a:"依第21條，教保服務人員、學前特殊教育教師、社會工作人員、護理人員、職員及廚工共六類人員，適用附表一至附表四之薪資支給基準表。其餘人員（如清潔人員）薪資由非營利法人自行議定，但不得逾對應類別支給基準，且不得低於最低工資法規定之最低工資。"},
{cat:"人事薪資", q:"初任人員的年資如何採計加級？", a:"曾於其他教保服務機構任職者，年資至多採5級；但曾任職於非營利幼兒園、或政府機關(構)公營公司委託辦理之職場互助教保服務中心者，至多採20級。私立幼兒園改辦非營利幼兒園者，原任職於該私立幼兒園之年資至多採5級，或依原私立幼兒園薪資擇優支給。畸零、未滿1學年之年資原則不予採計，不同機構年資也不得合併計算。"},
{cat:"人事薪資", q:"清潔人員薪資可否比照廚工基準表？", a:"清潔人員薪資得比照「未具丙級中餐烹調士證照」之廚工支給基準，自行議定但不得逾該基準各級薪資級距下限。"},
{cat:"人事薪資", q:"聘用人員學歷未列於薪資支給基準表（如高中職）應如何敘薪？", a:"聘用教保服務人員及職員學歷為高中職者，薪資自行議定，但不得逾該職務支給基準各級薪資級距下限。"},
{cat:"人事薪資", q:"學期中任職的人員，次學年可以晉薪嗎？", a:"原則上須任職至學年度終了屆滿1學年才辦理年終考核並於「次學年度」晉薪。例外：8月份到職者，或自112學年度起經法人同意於學期中調任至同法人辦理之園所者，可採計年資晉薪；其餘學期中任職者，須待再次一學年度終了考核後，於再次一學年度晉薪。"},
{cat:"人事薪資", q:"契約期間可以增聘服務人員嗎？", a:"如有增聘需求，應報委託單位或直轄市縣市主管機關核准後辦理，所需人事費得於總預算內調整，但不得挪用材料費，且不得異動原核定之員額編制。"},
{cat:"人事薪資", q:"職務代理人的薪資怎麼算？", a:"依附表一至附表四規定敘薪，另聘之職務代理人代理期間一律以第1級敘薪，不得晉薪。若係園內資深教保服務人員代理園長職務（非職缺出缺），則依原薪級敘薪。代理3個月以內原則由代課代班費支用，超過3個月原則改由薪資支用。"},
{cat:"人事薪資", q:"護士與護理師的年資可以合併採計嗎？", a:"不可以。依薪資支給基準表，護士與護理師適用不同支給基準，年資不得合併採計。"},
{cat:"人事薪資", q:"非營利幼兒園需要與各類服務人員簽訂書面勞動契約嗎？", a:"雖勞動契約非要式契約，不以書面為必要，但為保障勞動權益，非營利幼兒園應以書面方式與各類服務人員簽訂勞動契約，並載明起始薪資數額；專兼任人員及助理人員應簽不定期契約，職務代理人簽定期契約。"},
{cat:"人事薪資", q:"留職停薪期間年資如何計算？", a:"留職停薪期間無具體工作事實，不計入工作年資。若學年度間辦理留職停薪且任一月份完全無在職事實，當學年度年資中斷，該人員應另予考核並於次學年度留原薪級；但產假不屬留職停薪，不需自年資或年終獎金期間扣除。"},
{cat:"人事薪資", q:"營運成本全部由家長自付的非營利幼兒園，人員薪資規範相同嗎？", a:"不同。依第24條，這類園所之教保服務人員及其他服務人員之薪資、考核及晉薪，不受第21條、第22條支給基準限制，改由非營利法人自行擬訂，報直轄市縣市主管機關核定即可。"},
// ---- 年終考核與獎金 ----
{cat:"考核與獎金", q:"年終考核的等第與晉薪規定為何？", a:"依第22條，年終考核分三等：甲等（80分以上，次學年薪資得提高1級）、乙等（70分以上未滿80分，提高半級）、丙等（未滿70分，留原薪級）。114年修法已刪除「年終考核甲等比率」限制，考核應依各園核定通過之考核規定覈實辦理，不再受績效考評結果比率限制。"},
{cat:"考核與獎金", q:"哪些情形年終考核不得考列甲等？哪些只能列丙等？", a:"不得列甲等情形（第23條）：曠職紀錄；未經同意在外兼職兼課；因病已達延長病假；事病假合計逾28日；工作不力有具體事實；影響園所聲譽有具體事實。僅得列丙等情形：對幼兒有身心虐待、體罰、霸凌、性騷擾、不當管教等身心暴力或不當對待，且有具體事實；或其他影響幼兒重大權益且有具體事實者。"},
{cat:"考核與獎金", q:"年終工作獎金的計算基準與發給上限為何？", a:"營運成本人事費之年終工作獎金預算，以每名專任人員每年1.5個月月薪（含職務加給）編列，新設園第1學年以0.625個月編列。實際發給依年終考核結果，由非營利法人擬訂發放辦法，最高以2個月為限；發給時間為春節前10日一次發給，不得提早或延遲。"},
{cat:"考核與獎金", q:"哪些情形不發或減發年終工作獎金？", a:"年終考核或另予考核列丙等（含）以下者，不發給；年度中累積曠職達4日者，發給三分之一數額；累積曠職達3日者，發給三分之二數額。同時符合2款以上者，依款次在前規定辦理。"},
{cat:"考核與獎金", q:"留職停薪、部分工時人員及職務代理人可以領年終工作獎金嗎？", a:"留職停薪人員於當年度12月1日前未離職或未經資遣者，得依實際在職月數比例計發；部分工時人員按月計酬者比照全時人員計算，按日計酬者可依規定發給，按時計酬者不發給；職務代理人代理當月實際代理滿1日以上且12月仍在職者，可併計發給。"},
{cat:"考核與獎金", q:"非營利幼兒園及職場中心年終考核最新規定重點為何（114年修法）？", a:"114年2月7日修正發布之辦法已刪除「各類服務人員年終考核甲等比率應依當學年度績效考評結果辦理」之規定，自113學年度起，各園依核定通過之考核規定覈實辦理，無須受績效考評結果之限制。"},
// ---- 會計與經費 ----
{cat:"會計與經費", q:"非營利幼兒園賸餘款需要繳稅嗎？", a:"賸餘款屬「銷售勞務所得」，應依承辦非營利法人之會計年度，與其併同辦理申報課稅，再以實際繳納金額覈實入帳；分攤所得稅時應檢附法人之所得稅結算申報書影本及所得稅分攤表。"},
{cat:"會計與經費", q:"資遣費準備金與業務發展準備金應如何儲存？", a:"應以專戶或定期存款方式儲存，並與一般活期存款專戶區隔。專戶孳息皆視為園所收入；業務發展準備金以定存方式儲存者，其利息應轉入園所活期存款帳戶。"},
{cat:"會計與經費", q:"業務發展準備金如何提列？", a:"依辦法第34條第1項，未發生虧損之年度得提列準備金，額度以當年度收入總額20%為限。年度結算賸餘款逾新臺幣12萬元者，應依規定提列，並於法人會計年度結算後3個月內申請，同意後1個月內（至遲於法人當年度所得稅申報日前）以專戶或定存儲存。"},
{cat:"會計與經費", q:"各項經費不足時可以互相流用嗎？", a:"依「非營利幼兒園會計財務及經費處理注意事項」第13點辦理流用及勻支；遇特殊情形或突發狀況，原則應事前報經直轄市縣市主管機關（委託辦理類型之員工子女園報委託單位）同意，於該學年度總預算內調整各項目支用額度。"},
{cat:"會計與經費", q:"非營利幼兒園可否使用自己原有的會計系統？", a:"原則上應使用「全國幼兒園幼生管理系統－非營利幼兒園會計專區」登載預算與逐日登帳；已使用自行開發會計系統者得繼續使用，但各項財務報表及會計簿籍格式須符合注意事項附件欄位規定；不符合者仍須改用全國系統登錄。"},
{cat:"會計與經費", q:"活動費可以支應校外教學及畢業典禮嗎？", a:"可以。畢業典禮、幼生紀念性相關資料（如畢業照片、紀念手冊）及其他教學活動（含鄰近社區戶外教學）已納入活動費支用範圍。惟辦理鄰近社區戶外教學原則上不得向家長收取額外費用；紀念性資料亦不得另向家長收費。"},
{cat:"會計與經費", q:"進修研習費的支用範圍為何？", a:"營運成本內以每名專任服務人員每年核予2,000元編列。人員自行報名參加之研習僅限支用報名費、材料費及手續費（除受指派代表出席主管機關規定之研習外，不得支付交通費、膳宿費）；園所自辦研習則可支應講座鐘點費、印刷費及邀請講師之交通膳宿費。"},
{cat:"會計與經費", q:"114學年度起餐點費的核定基準為何？", a:"依114年9月22日修正發布之營運成本規定，招收人數120人以下者每生每日以75元計算，121人以上者每生每日以70元計算，自114年8月1日起生效。不足者應依注意事項規定於原核定材料費及營運成本內流用勻支。"},
{cat:"會計與經費", q:"識別性園服（如T恤、圍兜、帽子）如何列帳？可以向家長另外收費嗎？", a:"教保材料費有餘額時得購置，並應規劃每學年發給數量；遺失或毀損不予補發，也不得另向家長收費，家長如有汰換需求得自行以相近款式替代。"},
{cat:"會計與經費", q:"每學年財產盤點需要哪些人一起辦理？", a:"依規定每學年應至少盤點一次，並由園長（或職場中心主任）偕同場地主管機關或委託單位、非營利法人三方共同盤點，亦得視需求會同直轄市縣市主管機關辦理。"},
{cat:"會計與經費", q:"雜支超支要怎麼處理？", a:"若超支原因屬園所必要支出、且非歸因於服務人員或非營利法人，可由營運成本支應，並於會計師查核附表勾選不符合；若超支原因非屬必要支出，應由非營利法人自行負擔，不得由營運成本支應。"},
// ---- 資遣費 ----
{cat:"資遣費", q:"契約屆滿、原法人不繼續辦理時，員工可以領資遣費嗎？如何計算？", a:"可以。依勞工退休金條例第12條，雇主按工作年資，每滿1年發給1/2個月平均工資，未滿1年按比例計給，最高以6個月平均工資為限（不適用勞基法第17條）。由原法人依辦理期間之營運成本及所提撥之資遣費準備金給付。"},
{cat:"資遣費", q:"經重新甄選由新法人接手辦理後，員工留任但日後被資遣，資遣費怎麼分攤？", a:"新法人依員工續留服務之總年資核算應得資遣費，扣除前期法人已結清部分後，就差額由新法人依辦理期間之營運成本及資遣費準備金支給；前後兩期薪資差額則由國教署另案補助，避免員工權益受損。"},
{cat:"資遣費", q:"私立幼兒園租約屆滿改辦非營利幼兒園（變更雇主），員工的資遣費如何處理？", a:"視同雇主變更，原私立幼兒園負責人應先依員工年資結清一次資遣費；日後由新承接之非營利法人接續計算年資，被資遣時資遣費以扣除已結清部分後之差額計算，分攤方式與委託辦理情形類似。"},
{cat:"資遣費", q:"依辦法第35條由同一非營利法人繼續經營、未變更雇主改辦非營利幼兒園，員工年資是否中斷？需要先結清資遣費嗎？", a:"不需要。因雇用法人未變更，員工年資不因辦理性質改變而中斷，無須於改辦當下先行給付資遣費；日後如被資遣，則依全部服務年資合併計算資遣費，由非營利法人依營運成本或資遣費準備金支給。"},
{cat:"资遣费", q:"非營利法人契約屆滿不再辦理，是否可能適用大量解僱勞工保護法？", a:"若同一廠場僱用勞工未滿30人，60日內解僱逾10人；或僱用30人以上未滿200人，60日內解僱逾三分之一或單日逾20人，即構成大量解僱，應於符合情形之日起60日前將解僱計畫書通知主管機關及相關單位並公告；未依限辦理者，處10萬元以上50萬元以下罰鍰並得按日連續處罰。"},
{cat:"資遣費", q:"助理人員（教師助理員、特教學生助理員）被資遣，資遣費由誰支應？", a:"助理人員資遣費不得由營運成本之資遣費準備金支應（因其係依補助要點核予時數配置），應依勞動基準法及補助要點相關規定，以補助經費支應；惟若受雇者被資遣時身分為教保服務人員（曾轉任），則資遣費應由營運成本人事費額度內支應。"},
// ---- 契約續辦與終止 ----
{cat:"契約與終止", q:"非營利幼兒園連續三學年通過績效考評，可以申請契約屆滿後繼續辦理嗎？", a:"可以（辦法第30條）。應於契約期間屆滿8個月前，向委託單位或直轄市縣市主管機關提出後續4學年之經營計畫書，經評估履約情形、基礎評鑑結果、裁罰紀錄及其他情形後，得同意繼續辦理，每次期間為4學年；未於期限內申請，或申請未經同意者，契約屆滿即應終止辦理並公告。"},
{cat:"契約與終止", q:"非營利法人有哪些情形，委託單位應終止契約並公告？", a:"依第31條：違反本法、教保服務人員條例、勞基法、辦法或於園內進行商業活動等，經限期改善屆期未改善；發生財務困難影響正常運作並損及幼兒權益；發生其他嚴重影響經營及人員權益之情事；績效考評結果不通過；以委託經營權向金融機構借貸。累計達2次公告者，該法人及董理事長即不得再接受委託或申請辦理。"},
{cat:"契約與終止", q:"契約屆滿時若有賸餘款，優先用途為何？", a:"依第34條，經同意繼續辦理（或重新委託仍由原法人辦理）者，賸餘款優先用於該園人員資遣費及繼續辦理契約期間之人事費；未申請繼續辦理或未獲同意、契約終止者，優先用於人員資遣費，處理後如仍有賸餘，應於屆滿或終止後2個月內全數繳回委託單位或直轄市縣市主管機關，用於改善教學設施設備。"},
{cat:"契約與終止", q:"直轄市、縣市主管機關與中央主管機關對非營利幼兒園的檢查、訪視及輔導權責如何劃分？", a:"依114年新增第24條之1，直轄市縣市主管機關應定期至園檢查及輔導，發現辦理不善或違反法規、契約者，應依相關法規裁處、令限期改善，或依契約規定辦理；中央主管機關於必要時得訪視非營利幼兒園，如發現辦理不善或違規，應通知直轄市縣市主管機關依前述規定辦理。"},
// ---- 檢查訪視與績效考評 ----
{cat:"考評與訪視", q:"每學年度的考核、到園檢查及績效考評時程為何？", a:"依第25條，委託辦理者由委託單位、申請辦理者由直轄市縣市主管機關，定期辦理：前學年度工作報告及財務報表審查、每學年度至少到園檢查一次、每學年度應於6月30日前完成績效考評（但第二學期開辦者當學年度免辦）。績效考評達90分以上且經同意繼續辦理者，得改為每2學年度到園檢查一次。"},
{cat:"考評與訪視", q:"績效考評的內容包含哪些項目？滿分及公告時程？", a:"依第27條，考評內容包括：招收幼兒情形、收托需要協助幼兒情形、家長滿意情形（問卷調查）、契約履約情形、到園檢查結果、會計查核簽證情形、其他經中央主管機關公告事項。總分100分，考評指標與問卷、到園檢查表及考評方式，中央主管機關應於考評6個月前公告。"},
{cat:"考評與訪視", q:"績效考評結果多少分算通過？不服考評結果可以申復嗎？", a:"依第28條，達70分以上為通過，未滿70分為不通過。受考評園所如對結果不服，得於收到結果2星期內載明具體理由並檢附證明文件提起申復（委託辦理者向委託單位或依權責向主管機關提起，申請辦理者向直轄市縣市主管機關提起）；申復有理由者修正結果，無理由者維持原結果。"},
{cat:"考評與訪視", q:"考評小組的組成方式與委員迴避規定為何？", a:"依第26條，考評小組置委員3至5人，由委託單位、各級主管機關就教保服務人員、會計與教保學者專家及各機關（構）、學校代表聘（派）兼之，任期至該次考評任務完成為止；考評時準用第6條利益迴避規定，涉及自身或有利害關係之委員應自行迴避，不自行迴避者主席應命其迴避。"},
{cat:"考評與訪視", q:"財務資訊多久公告一次？公告內容包含哪些？", a:"依第25條第4項，委託辦理者由委託單位、申請辦理者由直轄市縣市主管機關，於每學年度結束後公告財務資訊，內容包括：會計師簽證之查核報告、資產負債表（平衡表）、收支餘絀表（損益表）、當學年度收支預算編列明細表及其他指定報表，並應包括各報表必要之附註。"},
// ---- 延長照顧服務 ----
{cat:"延長照顧服務", q:"延長照顧服務的性質定位是什麼？家長可以被強迫參加嗎？", a:"延長照顧服務屬「照顧」性質，非教保活動或課程，內容應符合幼兒身心發展並兼顧生活教育，不得辦理課後才藝；應尊重家長意願，不得強迫參加，也不得縮短契約所定教保服務時間、提早收取延長照顧服務費用（收費開始時間不得早於下午5時）。"},
{cat:"延長照顧服務", q:"延長照顧服務時段招收有身心障礙幼生，助理人員經費怎麼申請？", a:"自113年2月1日起，非營利幼兒園招收之身心障礙幼生參加延長照顧服務者，園所得依補助要點向地方主管機關申請配置助理人員經費，並應於學期結束後2個月內至全國幼兒園幼生管理系統填報辦理情形及經費執行情形。"},
{cat:"延長照顧服務", q:"停止服務五日期間，助理人員有教育訓練或備課需求，薪資如何支應？", a:"助理人員應依安排之時數到園出勤參與增能研習或準備融合教材課程，並依實際出勤狀況核予鐘點費；不宜要求助理人員到園辦理與備課、教育訓練無關之業務。"},
{cat:"延長照顧服務", q:"逾時延長照顧服務對象是否也享有減免優惠？", a:"不適用。原延長照顧服務之減免對象（低收入戶、中低收入戶、特定所得條件之5足歲幼兒等）僅適用各園所訂之延長照顧服務時段；逾時照顧服務時段之收費，一律比照一般幼生辦理，不予減免。"},
{cat:"延長照顧服務", q:"延長照顧服務若收入不足支應人事費，該如何處理？", a:"延長照顧收入應優先支用教保服務人員及其他服務人員因帶班及協助行政事宜衍生之延長工時工資。若收入不足支應：依勞基法加班費計算方式發給者，得以營運成本支應；若優於勞基法計算方式發給者，差額須由非營利法人自行負擔，不得以營運成本支應。"},
// ---- 勞動權益與其他雜項 ----
{cat:"勞動權益雜項", q:"教保服務人員的午休時段可否不給予連續30分鐘休息？", a:"因幼兒教保服務具不可中斷性、午休期間本應安排人員在場照護，如工作具連續性或緊急性、無法給予連續30分鐘休息，雇主得依勞基法第35條但書規定，於工作時間內另行調配休息時間；惟工作完成已逾原約定下班時間且無繼續提供勞務必要者，無庸另予休息時間。"},
{cat:"勞動權益雜項", q:"颱風天停班停課，助理人員是否給薪？", a:"依「天然災害發生事業單位勞工出勤管理及工資給付要點」，因轄區首長通知停止上班而未出勤者，雇主宜不扣發工資，亦不得視為曠工、遲到或強迫請假；園所得自行評估是否發給助理人員當日薪資，但依規定「宜」不扣發。"},
{cat:"勞動權益雜項", q:"短期代班廚工是否需要先做健康檢查才能上工？", a:"需要。依食品良好衛生規範準則規定，食品從業人員（含短期代班廚工）進用時須經醫療機構檢查A型肝炎、傷寒、出疹、膿瘡、外傷、手部皮膚病等合格後才能聘僱，雇主每年應主動辦理至少一次相關檢查；短期代班廚工當年度內辦理之健康檢查於當年度內有效。"},
{cat:"勞動權益雜項", q:"部分工時教師助理員（時薪制）的例假及休息日工資要另外加給嗎？", a:"不需要。部分工時人員如按時計酬且以每小時基本工資約定，其例假及休息日工資已計入最低工資「時薪」中，無須外加計給；出勤時間若固定於週一至週五、遇國定假日則依法給予休假且工資照給。"},
{cat:"勞動權益雜項", q:"申請加班費需要符合什麼條件？", a:"園所應訂有加班機制及流程，採事先申請經同意、事後核准方式，事由須具體並留有申請及出勤紀錄；須因園所指定要求必須參加之公務活動，或因應收托時間有實際延長工時需求者，始得支領加班費。"},
{cat:"勞動權益雜項", q:"停托期間家長可以請家庭照顧假嗎？", a:"經勞動部釋示，受僱者若確有親自照顧之需求並敘明必要性，可依性別平等工作法第20條規定請「家庭照顧假」，雇主不得拒絕。"},
{cat:"勞動權益雜項", q:"5月1日勞動節，非營利幼兒園需要提供教保服務嗎？", a:"依紀念日及節日實施條例第6條規定，5月1日勞動節屬全國性放假之節日，非教保服務日；非營利幼兒園各類服務人員於勞動節當日或補假當日無須出勤，也無須彈性提供教保服務。"},
{cat:"勞動權益雜項", q:"什麼是「偏遠地區」？在哪裡查詢清冊？", a:"依幼兒教育及照顧法施行細則第8條第1項，偏遠地區指人口密度低於全國平均人口密度五分之二之鄉（鎮、市、區）。可於「全國教保資訊網／幼兒園專區／法令函釋／幼照法及教保服務人員條例／幼兒教育及照顧法施行細則（含偏遠地區清冊）」查詢完整名單。"},
{cat:"勞動權益雜項", q:"教保服務人員或其他服務人員涉疑似違法事件遭停職，其職務代理及薪資如何處理？", a:"園所可自行決定由增置人力代理出缺職務，或另聘代理人員；代課人員之代課費以人事費項下代課代班費支應，不足則於人事費額度內勻支。若調查結果未構成消極資格，應返還停職期間該員未支領之薪資（不含職務加給），由營運成本人事費支應。"},
// ---- 幼照法／教保服務人員條例 基礎規範 ----
{cat:"幼照法與人員條例", q:"「教保服務機構」與「教保服務人員」在幼照法上的定義各是什麼？", a:"依幼照法第3條：教保服務機構指以幼兒園、社區互助式、部落互助式或職場互助式方式，提供幼兒教育及照顧服務者；教保服務人員指提供教保服務之園長、教師、教保員及助理教保員；另有「其他服務人員」概念，指財團法人幼兒園之董事、監察人及前述人員以外，於教保服務機構服務之人員（如職員、廚工、社工、護理人員等）。"},
{cat:"幼照法與人員條例", q:"進用教職員工後，園所應在多久內向主管機關報備查？", a:"依幼照法第15條，教保服務機構於進用教職員工後30個工作日內，應檢具相關名冊、學經歷證件、身分證明文件影本，並附最近3個月內核發之警察刑事紀錄證明書等基本資料，報直轄市、縣市主管機關備查；人員異動時亦同。未依限報備查，可處負責人新臺幣5萬元以上25萬元以下罰鍰。"},
{cat:"幼照法與人員條例", q:"哪些情形教保服務人員會被「終身」禁止再任用？", a:"依教保服務人員條例第12條，若有：內亂外患罪、貪污經判刑確定、犯性侵害犯罪防治法所定之罪經判刑確定、經主管機關調查確認性侵害屬實、知悉性侵害事件未依規定通報致再度發生、體罰霸凌致幼兒身心嚴重侵害等情形，教保服務機構應予解聘、免職或終止契約關係，且終身不得再任用為教保服務人員。"},
{cat:"幼照法與人員條例", q:"哪些情形是「一年至四年」的限期禁任？", a:"依教保服務人員條例第13條，經主管機關調查確認有性騷擾或性霸凌行為、受兒少性剝削防制條例或性騷擾防治法處罰、經社政主管機關依兒少權法第97條處罰、體罰霸凌造成幼兒身心侵害（非達嚴重程度）、行為違反相關法規有傷害兒少之虞等情形，應解聘、免職或終止契約，並認定1年至4年不得再任用。"},
{cat:"幼照法與人員條例", q:"教保服務人員知悉幼兒疑似受虐或受性侵害，通報時限是多久？", a:"依教保服務人員條例第15條、第33條第2項，教保服務人員於執行業務知悉相關違法情形，應依兒少權法等規定通報，並應通報直轄市、縣市主管機關，至遲不得超過24小時。逾期未通報者，依同條例第43條第2項處新臺幣3萬元以上15萬元以下罰鍰。"},
{cat:"幼照法與人員條例", q:"教保服務機構可以用派遣方式進用教保服務人員嗎？", a:"不可以。依教保服務人員條例第32條第1項，教保服務機構不得以派遣方式進用教保服務人員；且應進用具教保服務人員資格、無消極資格情形者從事教保服務，也不得借用未在該機構服務人員之資格證書，證書亦不得提供或租借他人使用。違反者可處負責人新臺幣6萬元以上30萬元以下罰鍰。"},
{cat:"幼照法與人員條例", q:"教保服務人員每年必須完成哪些在職訓練時數？", a:"依教保服務人員條例第34條，教保服務人員每年應參加教保專業知能研習18小時以上；新進用人員應於任職前2年內或任職後3個月內完成基本救命術訓練8小時以上，任職後每2年應接受性別平等及勞動權益相關課程各3小時以上、基本救命術訓練8小時以上、安全教育相關課程3小時以上及緊急救護情境演習1次以上。"},
{cat:"幼照法與人員條例", q:"非營利幼兒園仍須辦理幼兒園評鑑嗎？結果會公開嗎？", a:"是的。依幼照法第46條，直轄市縣市主管機關應對教保服務機構辦理檢查及輔導，並應對幼兒園辦理評鑑，評鑑報告及結果應公布於資訊網站；教保服務機構對檢查、評鑑不得規避、妨礙或拒絕，違反者可處負責人新臺幣6萬元以上30萬元以下罰鍰。"},
{cat:"幼照法與人員條例", q:"家長對教保服務有異議、申訴的管道為何？", a:"依幼照法第40條，家長對教保服務有損及幼兒權益之異議，可先向教保服務機構提出，不服處理結果可於知悉結果之日起30日內向直轄市縣市主管機關提出申訴，該機關應召開申訴評議會處理；對評議決定不服者，得依法提起訴願或訴訟。"},
{cat:"幼照法與人員條例", q:"幼兒園接送車輛（娃娃車）有哪些法定要求？", a:"依幼照法第31條，接送幼兒應以經直轄市縣市主管機關核准之幼童專用車輛為之，車齡不得逾出廠10年，須經公路監理機關檢驗合格，駕駛人須具職業駕照，並配置具教保服務人員資格或成年人擔任隨車人員照護。駕駛人及隨車人員任職前後應定期接受基本救命術訓練、安全教育課程及緊急救護演習。"},
{cat:"幼照法與人員條例", q:"教保服務機構的收費項目及用途規定的法源依據是什麼？", a:"依幼照法第43條第1項，教保服務機構之收費項目及用途由中央主管機關定之（即教育部公告之「教保服務機構收費項目及用途規定」）；私立教保服務機構得依此考量營運成本訂定收費數額，於每學年度開始前對外公布並報直轄市縣市主管機關備查後收費；收退費基準應至少於每學期開始前一個月公告。"},
{cat:"幼照法與人員條例", q:"幼兒園班級人數與教保服務人員配置比例的基本規定為何？", a:"依幼照法第16條，2歲以上未滿3歲幼兒每班以16人為限；3歲以上至入國小前幼兒每班以30人為限。人力配置：2歲以上未滿3歲班級，招收8人以下配置1人、9人以上配置2人；3歲以上至入國小前班級，招收15人以下配置1人、16人以上配置2人。5歲至入國小前之班級，配置人員須至少1人為幼兒園教師（第17條）。"},
{cat:"幼照法與人員條例", q:"哪些人不得擔任教保服務機構負責人、財團法人幼兒園之董事或監察人？", a:"依幼照法第29條，除有第23、24、25條所列消極資格情形者外，曾犯內亂外患罪或貪污瀆職經判刑確定或通緝有案尚未結案者、褫奪公權尚未復權者、曾任公務人員受撤職休職處分期間尚未屆滿者、受破產宣告或清算程序尚未復權者、無行為能力或限制行為能力者、受輔助宣告尚未撤銷者，均不得擔任。"},
{cat:"幼照法與人員條例", q:"教保服務人員的代理制度是如何規範的？", a:"依教保服務人員條例第30條，教保服務人員、主任及組長因請假、留職停薪或其他原因出缺之職務，教保服務機構應建立代理制度，由代理人代理；情形特殊者代理人資格得不受一般資格限制，其資格、薪資等事項依相關辦法規定。未建立代理制度者，可處負責人新臺幣3千元以上1萬5千元以下罰鍰。"},
{cat:"幼照法與人員條例", q:"幼兒園分班的設立有什麼限制？", a:"依幼照法第8條，幼兒園得設立分班，原則以於同一鄉鎮市區內設立為限（學校於同一直轄市縣市內之分校分部分班則不受此限）；分班招收人數不得逾本園人數，並以60人為限。"},
{cat:"幼照法與人員條例", q:"教保服務機構經費使用有什麼基本法定要求？", a:"依幼照法第45條，教保服務機構各項經費收支保管及運用應設置專帳處理，收支應有合法憑證並依規定年限保存；私立教保服務機構會計帳簿與憑證之設置、取得、保管，應依相關稅法規定辦理；法人附設教保服務機構之財務應獨立。"},
];

/* ============================================================
   法規條文資料：非營利幼兒園實施辦法（114年2月7日修正發布全文39條）
   ============================================================ */
const LAW_ARTICLES = [
{no:"第一條", body:"本辦法依幼兒教育及照顧法（以下簡稱本法）第九條第二項規定訂定之。"},
{no:"第二條", body:"本辦法用詞，定義如下：\n一、非營利性質法人（以下簡稱非營利法人），指下列法人：\n　（一）學校財團法人及醫療法人。\n　（二）幼兒教保相關工會組織。\n　（三）依職工福利委員會組織準則所設，已完成法人設立登記之職工福利委員會。\n　（四）章程載明幼兒與兒童、家庭、教保服務人員福祉、教育或社會福利事務相關事項之財團法人或非營利社團法人。\n二、非營利幼兒園：指協助家庭育兒與幼兒之父母、監護人或實際照顧幼兒之人安心就業、促進幼兒健康成長、推廣優質平價及需要協助幼兒優先教保服務為目的，以下列方式之一辦理之私立幼兒園：\n　（一）由直轄市、縣（市）政府及所屬機關（構）、中央政府機關（構）、國立各級學校、軍警校院、鄉（鎮、市）公所及直轄市山地原住民區公所、公司組織之公營事業（以下併稱委託單位）委託非營利法人辦理。\n　（二）由非營利性質法人申請經直轄市、縣（市）主管機關核准辦理。"},
{no:"第三條", body:"中央主管機關為審議中央政府機關（構）與國營事業（以下併稱中央機關（構））、國立各級學校與軍警校院（以下併稱國立學校）委託非營利法人辦理非營利幼兒園，依本法第九條第六項設非營利幼兒園審議會（以下簡稱審議會）；其任務如下：\n一、非營利幼兒園辦理計畫之審議。\n二、委託辦理非營利幼兒園之甄選。\n三、非營利幼兒園營運成本及延長照顧服務費以外之代收或代辦費用項目及數額之審議。\n四、非營利幼兒園違反規定終止契約或停止辦理之審議。\n五、其他依法規規定或中央主管機關交議事項。\n直轄市、縣（市）主管機關為審議直轄市、縣（市）政府與所屬機關（構）、鄉（鎮、市）公所、直轄市山地原住民區公所及公司組織之地方公營事業（以下併稱地方機關（構））委託非營利法人辦理非營利幼兒園，及非營利法人申請辦理非營利幼兒園，依本法第九條第六項設審議會；其任務如下：\n一、非營利教保服務政策及其發展策略之諮詢。\n二、非營利幼兒園辦理計畫之審議。\n三、委託辦理非營利幼兒園之甄選或申請辦理非營利幼兒園之審議。\n四、營運成本全部由幼兒之父母、監護人或實際照顧幼兒之人自行負擔之非營利幼兒園收費基準之審議。\n五、非營利幼兒園營運成本及延長照顧服務費以外之代收或代辦費用項目及數額之審議。\n六、非營利幼兒園違反規定終止契約或停止辦理之審議。\n七、其他非營利幼兒園教保服務事項之建議、諮詢及依法規規定或直轄市、縣（市）主管機關交議事項。"},
{no:"第四條", body:"中央主管機關所設審議會，置委員十三人至十九人，其中一人為召集人，一人為副召集人，均由中央主管機關首長指定之人兼任；其餘委員由中央主管機關首長就下列人員聘（派）兼之：\n一、教保與兒童福利學者專家代表二人至五人。\n二、勞工團體代表一人。\n三、兒童福利團體代表一人。\n四、教保服務人員團體代表一人或二人。\n五、家長團體代表一人。\n六、婦女團體代表一人。\n七、中央主管機關代表一人或二人。\n八、其他會計、法律、教育、社會福利相關專業人員或社會公正人士三人或四人。\n直轄市、縣（市）主管機關所設審議會，置委員十五人至二十一人，其中一人為召集人，由直轄市、縣（市）長或其指定之人兼任；一人為副召集人，由直轄市、縣（市）教育局（處）長兼任；其餘委員，由直轄市、縣（市）長就下列人員聘（派）兼之：\n一、教保與兒童福利學者專家代表二人至五人。\n二、勞工團體代表一人。\n三、教保團體代表一人或二人。\n四、兒童福利團體代表一人。\n五、教保服務人員團體代表一人或二人。\n六、家長團體代表一人。\n七、婦女團體代表一人。\n八、直轄市、縣（市）主管機關代表二人。\n九、其他會計、法律、教育、社會福利相關專業人員或社會公正人士三人或四人。\n各級主管機關審議會，於辦理本機關以外委託辦理計畫之審議或委託辦理之甄選時，應增聘委託單位委員一人或二人；其委員人數及任期不受前二項及第六項規定之限制。\n除第二項第三款外，第一項及第二項各款委員，不得為幼兒園負責人。\n各級主管機關審議會委員中，任一性別委員不得少於全體委員總數三分之一。\n各級主管機關審議會委員任期為二年，期滿得續聘（派）兼之。但代表機關或團體出任者，應隨其本職進退。\n各級主管機關審議會委員應本公益立場行使職權；委員於任期內無法行使職權，或有不適當之行為，得予解聘（派）；其缺額，依第一項及第二項規定，聘（派）委員補足其任期。\n各級主管機關應定期辦理審議會委員講習會，向審議會委員說明非營利幼兒園相關機制、審議會之任務及審議方式。\n依中華民國一百十四年二月七日修正施行之第二項規定改聘（派）委員，其任期至原聘（派）委員任期屆滿之日止。"},
{no:"第五條", body:"各級主管機關審議會每年開會一次，必要時得召開臨時會議。會議召開時，由召集人為主席，召集人因故不能出席會議時，由副召集人代理主席。正、副召集人均不能出席會議時，由出席委員互推一人代理主席。\n各級主管機關審議會召開會議時，機關或團體代表以外之委員應親自出席，不得代理。\n經委員總額二分之一以上之出席，始得開會，並經出席委員過半數之同意，始得決議；同數時，由主席裁決之。"},
{no:"第六條", body:"各級主管機關審議會會議討論之事項，涉及委員或與委員有利害關係之人時，該委員應自行迴避，並不得參與該案決議；於該案決議時，迴避之委員不計入出席委員人數。\n各級主管機關審議會委員有前項所定之情形而不自行迴避者，會議主席應命其迴避。"},
{no:"第七條", body:"直轄市、縣（市）主管機關於所轄地區之優質、平價教保服務供給不足，或需要協助幼兒比率較高者，應優先考量規劃辦理非營利幼兒園，並不得以停辦公立幼兒園改辦非營利幼兒園之方式為之。\n直轄市、縣（市）主管機關為擴大公共化教保服務供應量而辦理非營利幼兒園，經審慎評估後，必要時得將公立幼兒園遷移至鄰近場地繼續辦理，於原場地空間辦理非營利幼兒園。"},
{no:"第八條", body:"委託單位委託辦理非營利幼兒園者，應擬訂委託辦理計畫，分別依下列程序為之：\n一、中央機關（構）、國立學校委託辦理者，經中央機關（構）、國立學校送中央主管機關提審議會審議後，由委託單位公告；中央主管機關委託辦理者，逕提審議會後並公告。\n二、地方機關（構）委託辦理者，經地方機關（構）送直轄市、縣（市）主管機關提審議會審議後，由委託單位公告；直轄市、縣（市）政府委託辦理者，逕提審議會後並公告。\n前項委託辦理計畫，應包括下列事項：\n一、非營利幼兒園地點規劃、社區資源評估及其他相關事項。\n二、所需土地、建築物及設施、設備之取得方式。\n三、需求說明書及契約書草案。\n非公司組織之委託單位委託辦理非營利幼兒園，需用之公有不動產，應以無償方式提供受託非營利法人使用。該公有不動產非自行經管者，得依法撥用，或經管理機關同意無償提供。\n第二項第三款需求說明書，應記載委託辦理案名稱、依據、目標、辦理方式、委託事項、委託期程、設置地點、招收幼兒人數、招收需要協助幼兒之規定、營運成本之負擔方式、提供之土地、建築物或設施、設備、受委託辦理者之資格、應檢附之文件及其他相關事項。\n委託單位依第一項規定公告委託辦理計畫，徵求有意願之非營利法人參加甄選時，應一併公告中央主管機關訂定之甄選基準及其他相關事項。"},
{no:"第九條", body:"採委託辦理方式辦理非營利幼兒園者，非營利法人應依前條第一項公告事項，檢具經營計畫書參加甄選；其經營計畫書，應包括下列事項：\n一、非營利法人名稱。\n二、非營利法人設立緣起、宗旨、法人登記證書、董（理）、監事名冊、組織架構圖、（捐助）章程及未來願景。\n三、非營利法人提供所興辦非營利幼兒園之協助。\n四、非營利法人最近二年年度決算及其會計查核流程。但新設立之非營利法人，免附決算。\n五、非營利幼兒園之宗旨、經營理念，及辦理期間之園務發展計畫。\n六、非營利法人與非營利幼兒園間相關專業資源之整合及規劃。\n七、非營利幼兒園人力資源之進用及其專業發展規劃。\n八、非營利幼兒園財務管理機制。\n九、非營利幼兒園預期辦理成效。\n十、其他相關事項。\n前項非營利法人曾經中央主管機關依下列規定之一公告，其公告次數累計達二次者，不得再接受委託辦理非營利幼兒園；其董（理）事長經公告次數累計達二次者，亦同：\n一、第三十一條第一項第一款至第三款、第五款、第三十二條第一項所定有第三十一條第一項第一款至第三款情事之一。\n二、職場互助式教保服務實施辦法第三十條第三項第一款至第三款或第五款。"},
{no:"第十條", body:"前條委託辦理案，應分別依下列程序締結契約：\n一、中央機關（構）、國立學校委託辦理者，經中央機關（構）、國立學校送中央主管機關提審議會甄選，並經委託單位同意後，與非營利法人締結契約；中央主管機關委託辦理者，逕提審議會甄選，並經同意後，與非營利法人締結契約。\n二、地方機關（構）委託辦理者，經地方機關（構）送直轄市、縣（市）主管機關提審議會甄選，並經委託單位同意後，與非營利法人締結契約；直轄市、縣（市）政府委託辦理者，逕提審議會。\n非公司組織之委託單位與非營利法人訂定之契約為行政契約。"},
{no:"第十一條", body:"採申請辦理方式辦理非營利幼兒園者，非營利法人應檢具經營計畫書，報直轄市、縣（市）主管機關；其經營計畫書，應包括下列事項：\n一、第九條第一項各款事項。\n二、土地、建築物所有權或使用權證明文件、建築物使用執照、教學設施、設備；其為已設立私立幼兒園者，應包括歷年評鑑結果及其他辦理績效。\n前項申請案經直轄市、縣（市）主管機關提審議會審議，並經直轄市、縣（市）主管機關核准後，與非營利法人締結行政契約。\n第一項非營利法人曾經中央主管機關依下列規定之一公告，其公告次數累計達二次者，不得再申請辦理非營利幼兒園；其董（理）事長經公告次數累計達二次者，亦同：\n一、第三十一條第一項第一款至第三款、第五款、第三十二條第一項所定有第三十一條第一項第一款至第三款情事之一。\n二、職場互助式教保服務實施辦法第三十條第三項第一款至第三款或第五款。"},
{no:"第十二條", body:"第十條及前條第二項之契約期間為四學年。但因契約期間無法銜接學年度者，得延長契約至屆滿之當學年度結束止。\n第十條及前條第二項之契約，應包括下列事項：\n一、履約標的。\n二、締約主體及其權利義務；屬委託辦理者，應包括委託單位應協助事項、提供之資源或經費。\n三、契約期間。\n四、履約管理事項。\n五、績效考評項目。\n六、契約變更、續辦、終止或解除及其損害賠償。\n七、契約終止時服務對象之安置。\n八、違反契約或爭議之處理。\n九、契約消滅之處理。\n十、其他相關事項。"},
{no:"第十三條", body:"非營利法人締結契約後，應依幼兒園與其分班設立變更及管理辦法規定，辦理該非營利法人附設或附屬非營利幼兒園之設立許可或變更事項。"},
{no:"第十四條", body:"非營利幼兒園應依本法第七條第四項規定，優先招收需要協助幼兒，其仍有餘額者，招收一般幼兒。\n前項非營利幼兒園，為依性別平等工作法第二十三條第一項第二款所設之托兒設施者，依下列順序招收幼兒：\n一、員工子女、孫子女。\n二、需要協助幼兒。\n三、前二款以外幼兒。\n直轄市、縣（市）政府採委託辦理方式辦理之非營利幼兒園，營運成本全部由幼兒之父母、監護人或實際照顧幼兒之人自行負擔者，其招收需要協助幼兒最低比率，由直轄市、縣（市）主管機關定之。\n第一項、第二項第二款、第三款登記入非營利幼兒園之幼兒人數，逾可招收幼兒名額時，同一順序幼兒應採公開抽籤方式為之。但第二項第三款幼兒登記入園時，其兄弟姊妹已於同一幼兒園就讀且非當學年度畢業者，得於同一順序優先招收。"},
{no:"第十五條", body:"非營利幼兒園全年服務日，比照行政院人事行政總處公告之行政機關辦公日辦理。但為進行環境整理、清潔消毒及課程討論等，每學期開學前，得停止服務五日，並列入年度行事曆。"},
{no:"第十六條", body:"非營利幼兒園教保服務人員及其他服務人員之配置，除依本法第十六條與幼兒園行政組織及員額編制標準有關私立幼兒園之規定辦理外，並得視其規模及實際需求，增設各組及增置人員。\n前項人員之勞動條件，依勞動基準法及其相關法令之規定辦理。"},
{no:"第十七條", body:"非營利幼兒園之營運成本，應以中央主管機關公告之項目及方式計算；委託辦理者由委託單位、申請辦理者由直轄市、縣（市）主管機關，依公告之項目及方式計算營運成本，並報中央主管機關核定後，始得依第十條及第十一條第二項規定，與非營利法人締結契約。\n前項營運成本，包括人事費、業務費、材料費、維護費、修繕購置費、公共事務管理費、雜支、行政管理費與土地、建築物、設施與設備之租金及其他相關費用。但無償提供之土地、建築物、設施及設備，不得計入營運成本。\n前項人事費，得包括資遣費準備金，每年最多提撥全園專任人員月薪總額之百分之十；並應專戶儲存。"},
{no:"第十八條", body:"幼兒每人每月應繳交之費用，應以契約期間之總營運成本，除以契約期間之月份數，再除以契約所載之約定招收總人數計算，並依下列方式之一，採按月、按季或按學期向幼兒之父母、監護人或實際照顧幼兒之人收費；其差額由政府協助支付：\n一、低收入戶及中低收入戶家庭子女：免繳費用。\n二、前款以外家庭子女：不得少於每月應繳交費用之百分之七十。但情形特殊或中央主管機關另有規定者，得調降比率。\n本辦法中華民國一百零八年九月二十四日修正施行前，非營利幼兒園已報直轄市、縣（市）主管機關同意，其營運成本採全部由幼兒之父母、監護人或實際照顧幼兒之人自行負擔方式者，得繼續依原規定辦理；修正施行後始辦理之非營利幼兒園，營運成本不得採全部由幼兒之父母、監護人或實際照顧幼兒之人自行負擔之方式辦理。"},
{no:"第十九條", body:"非營利幼兒園有向幼兒之父母、監護人或實際照顧幼兒之人收取營運成本以外代收或代辦費用之必要時，其收費項目及用途，應依本法第四十三條第一項規定辦理。\n非營利幼兒園收取營運成本以外之代收或代辦費用，除延長照顧服務費免經同意或核准，其數額依附件規定辦理外，應分別依下列程序同意或核准後，始得為之：\n一、委託辦理之非營利幼兒園，依下列規定提審議會審議，並經委託單位同意：\n　（一）中央機關（構）、國立學校委託辦理者，經中央機關（構）、國立學校送中央主管機關提審議會；中央主管機關委託辦理者，逕提審議會。\n　（二）地方機關（構）委託辦理者，經地方機關（構）送直轄市、縣（市）主管機關提審議會；直轄市、縣（市）政府委託辦理者，逕提審議會。\n二、申請辦理之非營利幼兒園，應報直轄市、縣（市）主管機關提審議會審議，並經各該主管機關核准。\n幼兒於學期教保服務起始日後，中途入園、離園者，應依幼兒就讀當日起算，按比率覈實收費、退費。\n幼兒因故請假並於事前辦妥請假手續，或依法令停課日數，連續達五日以上者，應按幼兒每人每月實際繳交費用，乘以請假或停課日數占當月教保服務總日數比率退費。"},
{no:"第二十條", body:"依本辦法、幼兒就讀教保服務機構補助辦法或其他中央主管機關所定性質相同之就學補助，每人每學期所領取之補助總金額，不得超過幼兒應繳之全學期收費總額，且不得重複請領各直轄市、縣（市）主管機關所定就讀教保服務機構之補助或育兒津貼。"},
{no:"第二十一條", body:"非營利幼兒園之教保服務人員、學前特殊教育教師、社會工作人員、護理人員、職員及廚工之服務人員，其薪資支給基準，規定如附表一至附表四。\n前項人員屬初任人員者，按第一級之薪資計算。但初任人員曾任相同職務之下列年資，得予採計；其採計基準如下：\n一、曾於其他教保服務機構任職者，曾任職之年資，至多採五級。但其任職之教保服務機構為非營利幼兒園，或政府機關（構）、公營公司委託辦理之職場互助教保服務中心者，至多採二十級。\n二、所任職之私立幼兒園改辦為非營利幼兒園者，任職於該私立幼兒園之年資，至多採五級，或依原私立幼兒園薪資擇優支給。\n第一項以外人員之薪資，依其擔任工作繁簡難易、責任輕重及應具備之知能條件，自行議定。但不得逾第一項各類人員支給基準，並不得低於最低工資法規定之最低工資。\n非營利幼兒園支給第一項人員薪資，應納入契約，且得參考當地物價、薪資水準、專業知能及曾任職於幼兒園之工作年資，依附表一至附表四之薪級，於各該級別薪資範圍內，由非營利法人擬訂薪資支給、考核、晉薪及績效獎金支領相關規定，並分別依下列程序辦理：\n一、委託辦理之非營利幼兒園，規定如下：\n　（一）中央機關（構）、國立學校委託辦理者，由委託單位報中央主管機關核定。\n　（二）地方機關（構）委託辦理者，由委託單位報直轄市、縣（市）主管機關核定。\n二、申請辦理之非營利幼兒園：報直轄市、縣（市）主管機關核定。\n第一項及第三項人員年終工作獎金，其支給月數，得依年終考核結果發給，最高以發給二個月為限，由非營利法人擬訂年終工作獎金支給相關規定，並分別依下列程序辦理；其餘事項，比照當年度軍公教人員年終工作獎金發給注意事項規定辦理：\n一、委託辦理之非營利幼兒園：\n　（一）中央機關（構）、國立學校委託辦理者，由委託單位報中央主管機關核定。\n　（二）地方機關（構）委託辦理者，由委託單位報直轄市、縣（市）主管機關核定。\n二、申請辦理之非營利幼兒園：報直轄市、縣（市）主管機關核定。\n中華民國一百十年十二月三十日修正發布之第一項附表一至附表四，自一百十一年一月一日施行。\n中華民國一百十一年七月二十八日修正發布之第一項附表一，自一百十一年八月一日施行。\n中華民國一百十二年十二月二十五日修正發布之第一項附表一至附表四，自一百十三年一月一日施行。\n中華民國一百十四年二月七日修正發布之第一項附表一至附表四，自一百十四年一月一日施行。"},
{no:"第二十二條", body:"教保服務人員及其他服務人員應接受平時考核及年終考核。\n前項平時考核，應每學期辦理一次，並作為年終考核之依據。\n教保服務人員及其他服務人員任職至學年度終了屆滿一學年者，幼兒園應於每年七月三十一日以前完成年終考核。\n年終考核之等第、分數及晉薪規定如下：\n一、甲等：八十分以上；其次學年薪資，得提高一級。\n二、乙等：七十分以上未滿八十分；其次學年薪資，得提高半級。\n三、丙等：未滿七十分；其次學年薪資，留原薪級。"},
{no:"第二十三條", body:"教保服務人員及其他服務人員有下列情形之一者，年終考核不得考列甲等：\n一、有曠職之紀錄。\n二、園長未經非營利法人同意或教保服務人員未經園長同意，擅自在外兼課、兼職。\n三、因病已達延長病假。\n四、事、病假合計超過二十八日。\n五、工作不力致影響整體業務之完成或推展，有具體事實。\n六、影響非營利幼兒園聲譽，有具體事實。\n教保服務人員及其他服務人員有下列情形之一者，年終考核僅得考列丙等：\n一、對幼兒有身心虐待、體罰、霸凌、性騷擾、不當管教，或其他對幼兒之身心暴力或不當對待之行為，有具體事實。\n二、其他影響幼兒重大權益事項，且有具體之事實。\n教保服務人員及其他服務人員有第一項各款及前項第二款所定情形者，非營利法人或園長應與其面談，面談內容及結果，應於平時考核時記錄之。\n第一項第三款因病已達延長病假之情形，不包括經醫師診斷需安胎休養者，其治療、照護或休養期間之請假。第四款事、病假合計之日數，應扣除請家庭照顧假、生理假及因安胎事由請假之日數。"},
{no:"第二十四條", body:"非營利幼兒園之營運成本全部由幼兒之父母、監護人或實際照顧幼兒之人自行負擔者，其教保服務人員及其他服務人員之薪資、考核及晉薪，不受第二十一條及第二十二條規定之限制，由非營利法人擬訂，報直轄市、縣（市）主管機關核定。"},
{no:"第二十四條之一", body:"直轄市、縣（市）主管機關應定期至非營利幼兒園檢查及輔導；經檢查、輔導，發現其辦理不善，或有違反法規或契約規定者，應依相關法規裁處、令其限期改善，或由直轄市、縣（市）主管機關、委託單位依契約之規定辦理。\n中央主管機關於必要時，得訪視非營利幼兒園；發現其辦理不善，或有違反法規或契約規定者，應通知直轄市、縣（市）主管機關，依前項規定辦理。"},
{no:"第二十五條", body:"委託辦理者由委託單位、申請辦理者由直轄市、縣（市）主管機關，定期辦理下列事項：\n一、前學年度工作報告、前學年度預、決算書、資產負債表及收支餘絀表、當學年度工作計畫及學年度收支預算編列明細之審查。\n二、每學年度至少到園檢查一次。\n三、每學年度應於六月三十日前完成績效考評。但第二學期開辦者，該學年度免予辦理。\n非營利幼兒園每學年度績效考評達九十分以上，其依第三十條規定，經同意繼續辦理者，得每二學年度到園檢查一次。\n委託單位為中央機關（構）、國立學校者，第一項第二款與前項到園檢查，及第一項第三款績效考評，應由中央主管機關為之；委託單位為地方機關（構）者，得自行辦理或委由直轄市、縣（市）主管機關為之。\n委託辦理者由委託單位、申請辦理者由直轄市、縣（市）主管機關，於每學年度結束後，公告非營利幼兒園財務資訊於資訊網站；公告內容如下：\n一、前學年度經委託單位或直轄市、縣（市）主管機關委託之會計師簽證之查核報告。\n二、資產負債表或平衡表。\n三、收支餘絀表或損益表。\n四、當學年度收支預算編列明細表。\n五、其他經委託單位或直轄市、縣（市）主管機關指定之報表。\n前項公告之內容，應包括各款報表必要之附註。"},
{no:"第二十六條", body:"委託單位、各級主管機關為辦理前條第一項第三款、第三項績效考評，應組成考評小組。\n考評小組置委員三人至五人，由委託單位、各級主管機關，就教保服務人員、會計與教保學者專家及各機關（構）、學校代表聘（派）兼之。\n委託單位、各級主管機關應定期辦理考評小組委員講習，說明非營利幼兒園相關機制、考評小組之任務及考評方式。委託單位得協調直轄市、縣（市）主管機關協助辦理；中央主管機關得視實際需要辦理之。\n考評小組委員之任期，至該次考評任務完成為止。\n考評小組委員考評時，準用第六條規定。"},
{no:"第二十七條", body:"第二十五條第一項第三款績效考評，其考評應包括下列內容：\n一、招收幼兒情形。\n二、收托需要協助幼兒情形。\n三、幼兒之父母、監護人或實際照顧幼兒之人滿意情形。\n四、契約之履約情形。\n五、到園檢查結果。\n六、會計查核簽證情形。\n七、其他經中央主管機關公告事項。\n前項第三款幼兒之父母、監護人或實際照顧幼兒之人滿意情形，委託辦理者由委託單位、申請辦理者由直轄市、縣（市）主管機關，辦理各園幼兒之父母、監護人或實際照顧幼兒之人問卷調查之結果定之。\n第一項績效考評之總分為一百分；考評指標、幼兒之父母、監護人或實際照顧幼兒之人滿意度調查問卷、到園檢查表及考評方式，中央主管機關應於考評六個月前公告。"},
{no:"第二十八條", body:"非營利幼兒園績效考評結果達七十分以上者為通過；未滿七十分者為不通過。\n受考評之非營利幼兒園對考評結果不服者，得於收到結果二星期內，載明具體理由，並檢附相關證明文件，分別依下列規定提起申復：\n一、委託辦理之非營利幼兒園：\n　（一）中央機關（構）、國立學校委託辦理者，向中央主管機關提起。\n　（二）地方機關（構）委託辦理者，向直轄市、縣（市）主管機關提起。\n二、申請辦理之非營利幼兒園：向直轄市、縣（市）主管機關提起。\n申復有理由者，應修正其考評結果；申復無理由者，仍維持原考評結果。"},
{no:"第二十九條", body:"（本條已刪除）", deleted:true},
{no:"第三十條", body:"非營利幼兒園連續三學年通過績效考評者，非營利法人得申請於契約期間屆滿後繼續辦理。\n依前項規定申請繼續辦理者，應於期間屆滿八個月前，委託辦理者向委託單位、申請辦理者向直轄市、縣（市）主管機關提出後續四學年之經營計畫書，經評估其履約情形、基礎評鑑結果、裁罰紀錄及其他情形後，得同意繼續辦理，每次辦理期間為四學年；不予同意者，應以書面敘明理由通知非營利法人。\n未於前項所定期間申請繼續辦理，或申請繼續辦理未經同意者，契約期間屆滿時，應終止辦理非營利幼兒園，委託辦理者應由委託單位、申請辦理者應由直轄市、縣（市）主管機關公告之。"},
{no:"第三十一條", body:"非營利法人於受委託辦理非營利幼兒園期間有下列各款情形之一者，委託單位應以書面通知其終止契約，並將非營利法人及其董（理）事長名單報中央主管機關公告之：\n一、違反本法、教保服務人員條例、勞動基準法、本辦法，或於非營利幼兒園內進行教材之宣傳、推銷或其他商業性活動，或從事契約約定以外之工作、業務，及其他違反契約所定事項，經命其限期改善，屆期仍未改善。\n二、非營利幼兒園發生財務困難，致影響其正常運作，並損及幼兒權益。\n三、非營利幼兒園發生其他足以嚴重影響其經營及幼兒、教保服務人員或其他服務人員權益之情事。\n四、非營利幼兒園經委託單位及各級主管機關依第二十五條第一項第三款及第三項規定辦理績效考評，其考評結果為不通過。\n五、非營利幼兒園以委託經營權向金融機構借貸。\n前項委託單位與非營利法人終止契約前，應分別依下列程序辦理：\n一、中央機關（構）、國立學校委託辦理者，經中央機關（構）、國立學校送中央主管機關提審議會；中央主管機關委託辦理者，逕提審議會。\n二、地方機關（構）委託辦理者，經地方機關（構）送直轄市、縣（市）主管機關提審議會；直轄市、縣（市）政府委託辦理者，逕提審議會。\n依前條第三項規定終止辦理，或依前二項規定終止委託契約之非營利幼兒園，除委託契約另有規定外，非營利法人應將非營利幼兒園之各類財產設備、經營權、幼兒資料、行政檔案及其他相關文件、資料，移交委託單位。\n委託辦理之非營利幼兒園，經依前項規定移交後，得由直轄市、縣（市）主管機關協調委託公立幼兒園代為經營管理至依第十條規定完成委託辦理程序止，並應參酌幼兒之父母、監護人或實際照顧幼兒之人意願，協助安置該非營利幼兒園之幼兒。"},
{no:"第三十二條", body:"非營利法人於申請辦理非營利幼兒園期間，有前條第一項第一款至第四款情事之一者，直轄市、縣（市）主管機關應提報審議會審議後，以書面通知其廢止原核准及終止契約，並將非營利法人及其董（理）事長名單報中央主管機關公告之。\n依第三十條第三項規定情形終止辦理非營利幼兒園，或依前項規定終止契約者，直轄市、縣（市）主管機關應依幼兒園與其分班設立變更及管理辦法規定，辦理設立許可變更事宜，並對就讀該園之幼兒，必要時得參酌幼兒之父母、監護人或實際照顧幼兒之人意願協助安置。"},
{no:"第三十三條", body:"非營利幼兒園應按原核定經費項目及執行期間確實執行，其經費不得移作他用。\n非營利幼兒園應建立會計制度，且財務應獨立，經費之收支保管及運用，應設置專帳處理。\n非營利幼兒園之總務、會計職務或工作，不得由下列人員及其配偶、三親等以內血親、姻親擔任：\n一、非營利幼兒園之負責人、園長。\n二、非營利幼兒園所屬非營利法人之代表人、董（理）事。\n第二項會計制度之建立、財務處理與經費之收支、保管與運用及其他應遵行事項，應符合中央主管機關所定之規定。"},
{no:"第三十四條", body:"非營利幼兒園，於契約期間依經會計師簽證之各該學年度收支餘絀表有賸餘款時，應於次學年度繼續支用。未發生虧損之年度，委託辦理者得報經委託單位、申請辦理者得報經直轄市、縣（市）主管機關同意後提列準備金，並專戶儲存；提列金額，以當年度收入總額百分之二十為限。\n非營利幼兒園於契約期間屆滿時，經依會計師簽證之最後學年度資產負債表之累計餘絀有賸餘，於清償債務後仍有結餘者，其處理程序應依下列規定辦理：\n一、經同意由原非營利法人繼續辦理，或契約屆滿、終止而重新依第八條至第十條規定完成委託辦理程序，仍委託原非營利法人繼續辦理者，優先用於該園教保服務人員與其他服務人員之資遣費，及繼續辦理契約期間教保服務人員與其他服務人員之人事費。\n二、契約期間屆滿未申請繼續辦理，或申請繼續辦理未經同意、契約終止者：\n　（一）優先用於該園教保服務人員及其他服務人員之資遣費。\n　（二）依前目處理後，仍有賸餘款者，應於契約期間屆滿或終止後二個月內，委託辦理者全數繳回委託辦理之委託單位、申請辦理者全數繳回直轄市、縣（市）主管機關，用於改善該園、公立幼兒園或非營利幼兒園教學設施、設備。"},
{no:"第三十五條", body:"非公司組織之委託單位，有以公有土地、建築物或設施、設備，辦理幼兒園之需求者，應依本辦法規定委託辦理非營利幼兒園，或自行辦理公立幼兒園；其公有土地、建築物或設施、設備已出租或委託辦理私立幼兒園者，於契約期間屆滿後，亦同。但有特殊情形，經中央主管機關同意者，不在此限。\n前項私立幼兒園以出租或委託方式由非營利法人辦理者，委託單位得依下列規定辦理後，改辦非營利幼兒園，免依第八條至第十條規定之程序辦理：\n一、由委託單位檢具委託辦理計畫、非營利法人之經營計畫書及契約書草案，報各級主管機關核定。\n二、依第十七條公告之項目及方式計算非營利幼兒園之總營運成本，報中央主管機關核定後，與該非營利法人締結契約。"},
{no:"第三十六條", body:"本辦法所定非營利幼兒園應報委託單位、中央主管機關或直轄市、縣（市）主管機關同意、核准、核定、備查或提起申復之事項，非營利幼兒園應先經其所屬非營利法人同意後為之。"},
{no:"第三十七條", body:"委託單位或各級主管機關對於辦理非營利幼兒園著有績效者，應予獎勵。"},
{no:"第三十八條", body:"本辦法中華民國一百零八年九月二十四日修正施行前，已依修正前之規定，依政府採購法完成委託辦理程序者，依原契約約定辦理至契約期間屆滿後，應依本辦法辦理。\n本辦法中華民國一百零八年九月二十四日修正施行前，辦理計畫經審議會審議通過，且經直轄市、縣（市）主管機關公告者，得適用修正前之規定。\n本辦法中華民國一百十年二月二十六日修正施行前，委託辦理者由委託單位、申請辦理者由直轄市、縣（市）主管機關，與非營利法人締結之契約，已依第十七條、第二十一條第一項附表一至附表三所定薪資支給基準，或依第三十四條第二項第二款規定辦理者，於契約期間屆滿前，得適用修正前之規定。\n非營利法人應依中華民國一百十四年一月一日修正施行之第二十一條第一項附表一至附表四，及第二十一條第二項規定支給薪資，並由中央主管機關補助薪資調整差額，不適用前二項規定。\n中華民國一百十四年二月七日修正發布之前項規定，自一百十四年一月一日施行。"},
{no:"第三十九條", body:"本辦法除另定施行日期者外，自發布日施行。"},
];

const LAW_YZ = [
{no:"第一條", body:"為保障幼兒接受適當教育及照顧之權利，確立幼兒教育及照顧方針，健全幼兒教育及照顧體系，以促進其身心健全發展，特制定本法。\n幼兒之居家式托育服務，依兒童及少年福利與權益保障法之規定辦理。"},
{no:"第二條", body:"本法所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n本法所定事項涉及各目的事業主管機關業務時，各該機關應配合辦理。"},
{no:"第三條", body:"本法用詞，定義如下：\n一、幼兒：指二歲以上至入國民小學前之人。\n二、幼兒教育及照顧：指以下列方式對幼兒提供之服務：\n（一）居家式托育。\n（二）幼兒園。\n（三）社區互助式。\n（四）部落互助式。\n（五）職場互助式。\n三、教保服務機構：指以前款第二目至第五目方式，提供幼兒教育及照顧服務（以下簡稱教保服務）者。\n四、負責人：指教保服務機構依本法及其相關法規登記之名義人；其為法人者，指其董事長。\n五、教保服務人員：指提供教保服務之園長、教師、教保員及助理教保員。\n六、教保服務機構之其他服務人員：指財團法人幼兒園之董事、監察人及前二款以外，於教保服務機構服務之人員。"},
{no:"第四條", body:"各級主管機關為整合規劃、協調、諮詢及宣導教保服務，應召開諮詢會。\n前項諮詢會，其成員應包括主管機關代表、衛生主管機關代表、勞動主管機關代表、身心障礙團體代表、教保與兒童福利學者專家、教保與兒童福利團體代表、教保服務人員團體代表、家長團體代表及婦女團體代表；其組織及會議等相關事項之辦法及自治法規，由各主管機關定之。"},
{no:"第五條", body:"中央主管機關掌理下列事項：\n一、教保服務政策及法規之研擬。\n二、教保服務理念、法規之宣導及推廣。\n三、全國性教保服務之方案策劃、研究、獎助、輔導、實驗及評鑑規劃。\n四、地方教保服務行政之監督、指導及評鑑。\n五、全國性教保服務基本資料之蒐集、調查、統計及公布。\n六、協助教保服務人員組織及家長組織之成立。\n七、其他全國性教保服務之相關事項。\n前項第五款教保服務基本資料，至少應包括全國教保服務機構之收費項目與數額、評鑑結果、不利處分及其他相關事項。"},
{no:"第六條", body:"直轄市、縣（市）主管機關掌理下列事項：\n一、地方性教保服務方案之規劃、實驗、推展及獎助。\n二、教保服務機構之設立、監督、輔導及評鑑。\n三、公立幼兒園、非營利幼兒園、社區、部落或職場互助式教保服務之推動。\n四、親職教育之規劃及辦理。\n五、地方性教保服務基本資料之蒐集、調查、統計及公布。\n六、其他地方性教保服務之相關事項。\n前項第五款教保服務基本資料，至少應包括直轄市、縣（市）主管機關主管之教保服務機構之收費項目與數額、評鑑結果、不利處分及其他相關事項。"},
{no:"第七條", body:"教保服務應以幼兒為主體，遵行幼兒本位精神，秉持性別、族群、文化平等、教保並重及尊重家長之原則辦理。\n推動與促進教保服務工作發展為政府、社會、家庭、教保服務機構及教保服務人員共同之責任。\n政府應提供幼兒優質、普及、平價及近便性之教保服務，對處於離島、偏遠地區，或經濟、身心、文化與族群之需要協助幼兒，應優先提供其接受適當教保服務之機會，並得補助私立教保服務機構辦理之。\n公立幼兒園及非營利幼兒園應優先招收需要協助幼兒，其招收需要協助幼兒人數超過一定比率時，得報請直轄市、縣（市）主管機關增聘專業輔導人力。但依性別工作平等法第二十三條第一項第二款所設之托兒設施為非營利幼兒園者，依下列順序招收幼兒：\n一、員工子女、孫子女。\n二、需要協助幼兒。\n三、前二款以外幼兒。\n前二項補助、招收需要協助幼兒、一定比率及增聘輔導人力之辦法或自治法規，由各級主管機關定之。\n政府對接受教保服務之幼兒，得視實際需要補助其費用；其補助對象、補助條件、補助額度及其他相關事項之辦法，由中央主管機關定之。\n依前項規定請領補助之權利，不得扣押、讓與或供擔保。\n招收幼兒之教保服務機構應於金融機構開立專戶，並載明金融機構名稱、地址、帳號及戶名報直轄市、縣（市）主管機關核准後，專供存入第六項補助及其他政府協助幼兒接受教保服務之費用；其專戶內之存款，不得作為扣押、抵銷、供擔保或強制執行之標的，但依第八條第一項規定設立之私立幼兒園，其專戶內當學期撥入之費用，於該學期結束後，不在此限。\n政府得對幼兒之父母、監護人或實際照顧幼兒之人發放育兒津貼；其請領育兒津貼之權利，不得扣押、讓與或供擔保。\n幼兒之父母、監護人或實際照顧幼兒之人，得於金融機構開立專戶，並載明金融機構名稱、地址、帳號及戶名報直轄市、縣（市）主管機關核准後，專供存入前項育兒津貼；其專戶內之存款，不得作為扣押、抵銷、供擔保或強制執行之標的。"},
{no:"第八條", body:"直轄市、縣（市）、鄉（鎮、市）、直轄市山地原住民區、學校、法人、團體、醫院、商業或個人，得興辦幼兒園；幼兒園應經直轄市、縣（市）主管機關許可設立，並於取得設立許可後，始得招收幼兒進行教保服務。\n公立學校所設幼兒園應為學校所附設，其與直轄市、縣（市）、鄉（鎮、市）及直轄市山地原住民區設立者為公立，其餘為私立。但中華民國一百年十二月三十一日以前已由政府或公立學校所設之私立幼稚園或托兒所，仍為私立。\n幼兒園得設立分班；分班之設立，以於同一鄉（鎮、市、區）內設立為限。但學校於同一直轄市、縣（市）內設立之分校、分部或分班，其附設或附屬幼兒園分班，不在此限。\n幼兒園分班之招收人數，不得逾本園之人數，並以六十人為限。\n私立幼兒園得辦理財團法人登記，並設董事會。\n幼兒園與其分班基本設施設備之標準，及其設立、改建、遷移、擴充、招收人數、更名與變更負責人程序及應檢具之文件、停辦、復辦、撤銷或廢止許可、督導管理、財團法人登記、董事會運作及其他相關事項之辦法，均由中央主管機關定之。\n第一項興辦之幼兒園由公司、有限合夥、醫院或商業設立者，以招收其所屬及與其簽訂契約辦理聯合托育者之員工子女、孫子女為主，有餘額者，經直轄市、縣（市）主管機關核准後，始得招收其他幼兒。\n以各級學校教學場所辦理幼兒園者，得繼續適用原建築物使用類組，不受建築法第七十三條應申請變更使用執照規定之限制。"},
{no:"第九條", body:"非營利幼兒園應以下列方式之一設立：\n一、由直轄市、縣（市）政府及所屬機關（構）、中央政府機關（構）、國立各級學校、軍警校院、鄉（鎮、市）公所及直轄市山地原住民區公所（以下簡稱政府機關（構）及國立學校）、公司組織之公營事業委託非營利性質法人辦理。\n二、由非營利性質法人申請經直轄市、縣（市）主管機關核准辦理。\n前項非營利幼兒園之辦理方式、委託要件、委託年限、委託方式、收退費基準、教保服務人員及其他服務人員薪資、審議機制、考核、契約期滿續辦、終止契約、代為經營管理、法人資格及其他相關事項之辦法，由中央主管機關定之。\n第一項非營利性質法人為學校財團法人、醫療法人者，得自行設立附設或附屬非營利幼兒園，或由其設立之私立學校、醫院或非營利附設機構以附設或附屬方式辦理非營利幼兒園。\n政府機關（構）及國立學校委託辦理非營利幼兒園，需用之公有不動產，應以無償方式提供受託之非營利性質法人使用；該公有不動產非自行經管者，得辦理撥用，或經管理機關同意無償提供政府機關（構）及國立學校。\n第一項公司組織之公營事業委託非營利性質法人辦理非營利幼兒園，除我國締結之條約或協定另有規定者外，不受政府採購法之限制。\n各級主管機關為辦理第二項事項之審議，應召開審議會，由機關首長或指定之代理人為召集人，成員應包括勞工團體代表、教保與兒童福利學者專家、教保與兒童福利團體代表、教保服務人員團體代表、家長團體代表及婦女團體代表。"},
{no:"第十條", body:"直轄市、縣（市）主管機關應協助離島、偏遠地區國民小學附設幼兒園。\n離島、偏遠地區為因應地理條件限制及幼兒生活與學習活動之需要，得採社區互助式方式對幼兒提供教保服務；其機構經直轄市、縣（市）主管機關許可設立後，始得招收幼兒進行教保服務。\n為提供原住民族幼兒學習其族語、歷史及文化機會與發揮部落照顧精神，得採部落互助式方式對幼兒提供教保服務；其機構經直轄市、縣（市）主管機關許可設立後，始得招收幼兒進行教保服務。\n政府機關（構）、公司及非政府組織為照顧員工子女、孫子女，得採職場互助式方式對幼兒提供教保服務；其機構經直轄市、縣（市）主管機關許可設立後，始得招收幼兒進行教保服務。\n前三項地區範圍、辦理方式、招收人數、人員資格與配置、許可條件與程序、環境、設施與設備、衛生保健、直轄市、縣（市）主管機關輔導與協助、檢查、管理、撤銷或廢止許可、收退費及其他相關事項之辦法，由中央主管機關會商中央原住民族主管機關及中央勞動主管機關定之。\n採第二項及第三項方式提供教保服務，需用公有不動產者，得由公有財產管理機關以出租方式提供使用；其租金基準，按該不動產當期依法應繳納之地價稅及房屋稅計收年租金。\n政府機關（構）委託非營利性質法人辦理職場互助式教保服務，需用之公有不動產，應以無償方式提供受託非營利性質法人使用；該公有不動產非自行經管者，得辦理撥用，或經管理機關同意無償提供政府機關（構）。\n公司組織之公營事業委託非營利性質法人提供職場互助式教保服務，除我國締結之條約或協定另有規定者外，不受政府採購法之限制。\n前二項之非營利性質法人，包括學校財團法人。\n以各級學校教學場所辦理第二項至第四項教保服務者，得繼續適用原建築物使用類組，不受建築法第七十三條應申請變更使用執照規定之限制。"},
{no:"第十一條", body:"教保服務之實施，應與家庭及社區密切配合，以達成下列目標：\n一、維護幼兒身心健康。\n二、養成幼兒良好習慣。\n三、豐富幼兒生活經驗。\n四、增進幼兒倫理觀念。\n五、培養幼兒合群習性。\n六、拓展幼兒美感經驗。\n七、發展幼兒創意思維。\n八、建構幼兒文化認同。\n九、啟發幼兒關懷環境。"},
{no:"第十二條", body:"教保服務內容如下：\n一、提供生理、心理及社會需求滿足之相關服務。\n二、提供健康飲食、衛生保健安全之相關服務及教育。\n三、提供適宜發展之環境及學習活動。\n四、提供增進身體動作、語文、認知、美感、情緒發展與人際互動等發展能力與培養基本生活能力、良好生活習慣及積極學習態度之學習活動。\n五、記錄生活與成長及發展與學習活動過程。\n六、舉辦促進親子關係之活動。\n七、其他有利於幼兒發展之相關服務。\n前項第二款所謂之健康飲食，應依據中央主管機關所定幼兒園餐點食物內容及營養基準，以及中央衛生主管機關所定國人膳食營養素參考攝取量提供衛生、安全及營養均衡之餐食。\n幼兒之父母或監護人得依幼兒之需求，選擇參與全日、上午時段或下午時段之教保服務；教保服務機構於教保活動課程以外之日期及時間，得視父母或監護人需求，提供延長照顧服務。\n教保服務機構並得視其設施、設備與人力資源及幼兒父母或監護人之需求，經直轄市、縣（市）主管機關核准後，提供幼兒臨時照顧服務。\n幼兒教保活動課程大綱及服務實施準則，由中央主管機關定之。\n離島、偏遠地區教保服務機構得結合非營利組織、大專校院及社區人力資源，提供幼兒照顧服務及相關活動。"},
{no:"第十三條", body:"直轄市、縣（市）主管機關應依相關法律規定，對接受教保服務之身心障礙幼兒，主動提供專業團隊，加強早期療育及學前特殊教育相關服務，並依相關規定補助其費用。\n中央政府為均衡地方身心障礙幼兒教保服務之發展，應補助地方政府遴聘學前特殊教育專業人員之鐘點、業務及設備經費，以辦理身心障礙幼兒教保服務；其補助辦法，由中央主管機關定之。"},
{no:"第十四條", body:"教保服務機構得作為社區教保資源中心，發揮社區資源中心之功能，協助推展社區活動及社區親職教育。"},
{no:"第十五條", body:"教保服務機構於進用教職員工後三十個工作日內，應檢具相關名冊、學經歷證件、身分證明文件影本，並應附最近三個月內核發之警察刑事紀錄證明書等基本資料，報直轄市、縣（市）主管機關備查；異動時，亦同。直轄市、縣（市）主管機關應主動查證並得派員檢查。"},
{no:"第十六條", body:"幼兒園二歲以上未滿三歲幼兒，每班以十六人為限，且不得與其他年齡幼兒混齡；三歲以上至入國民小學前幼兒，每班以三十人為限。但離島、偏遠及原住民族地區之幼兒園，因區域內二歲以上未滿三歲幼兒之人數稀少，致其招收人數無法單獨成班者，得報直轄市、縣（市）主管機關同意後，以二歲以上至入國民小學前幼兒進行混齡編班，每班以十五人為限。\n幼兒園有招收身心障礙幼兒之班級，得酌予減少前項所定班級人數；其減少班級人數之條件及核算方式，由直轄市、縣（市）主管機關定之。\n幼兒園除公立學校附設者及分班免置園長外，應置下列專任教保服務人員：\n一、園長。\n二、幼兒園教師、教保員或助理教保員。\n幼兒園及其分班除園長外，應依下列方式配置教保服務人員：\n一、招收二歲以上至未滿三歲幼兒之班級，每班招收幼兒八人以下者，應置教保服務人員一人，九人以上者，應置教保服務人員二人；第一項但書所定情形，其教保服務人員之配置亦同。\n二、招收三歲以上至入國民小學前幼兒之班級，每班招收幼兒十五人以下者，應置教保服務人員一人，十六人以上者，應置教保服務人員二人。\n公立學校附設幼兒園者，除依前二項規定配置教保服務人員外，每園應再增置教保服務人員一人。\n直轄市、縣（市）主管機關為因應天然災害發生或其他緊急安置情事，有安置幼兒之必要者，應依下列規定辦理，不受第一項、第四項規定及核定招收人數數額之限制：\n一、當學年度招收二歲以上至未滿三歲幼兒，或依第一項但書規定混齡招收二歲以上至入國民小學前幼兒之班級，每招收幼兒八人，得另行安置一人。\n二、當學年度招收三歲以上至入國民小學前幼兒之班級，每招收幼兒十五人，得另行安置一人。\n三、幼兒園於次學年度起，除該學年度無幼兒離園者仍應依前二款規定辦理外，每班招收人數，應依第一項規定辦理。"},
{no:"第十七條", body:"幼兒園有五歲至入國民小學前幼兒之班級，其配置之教保服務人員，每班應有一人以上為幼兒園教師。\n幼兒園助理教保員之人數，不得超過園內教保服務人員總人數之三分之一。\n幼兒園得視需要配置學前特殊教育教師及社會工作人員。\n幼兒園及其分班應置護理人員，其合計招收幼兒總數六十人以下者，以特約或兼任方式置護理人員；六十一人至二百人者，以特約、兼任或專任方式置護理人員；二百零一人以上者，以專任方式置護理人員。但高級中等以下學校附設之幼兒園，其校內已置有專任護理人員者，得免再置護理人員。\n幼兒園達一定規模或其分班，得分組辦事，並置組長，其組長得由教師、教保員或職員兼任之；附設幼兒園達一定規模及直轄市、縣（市）、鄉（鎮、市）、直轄市山地原住民區設立之幼兒園得置專任職員；幼兒園應以專任或兼任方式置廚工。\n直轄市、縣（市）、鄉（鎮、市）及直轄市山地原住民區設立之公立幼兒園，其人事、主計業務，得由直轄市、縣（市）人事及主計主管機關（構）指派專任之人事、主計人員兼任，或經有關機關辦理相關業務訓練合格之職員辦理。公立學校附設之幼兒園，其人事、主計業務，由學校之專任（或兼任、兼辦）人事、主計人員兼辦。\n幼兒園之行政組織及員額編制標準，由中央主管機關定之。\n高級中等以下學校附設幼兒園者，其幼兒園班級數得與學校班級數合併，計算內部單位數與專任輔導教師、專業輔導人員、護理人員及其他人員之員額。但幼兒園已置專任護理人員者，應維持其專任員額，其幼兒園班級數不得與學校班級數合併計算護理人員之員額。"},
{no:"第十八條", body:"教保服務人員之培育、資格、權益、管理、申訴及爭議處理等事項，依教保服務人員條例之規定辦理。\n為促進離島、偏遠地區教保服務發展，各級主管機關得定期辦理該地區教保服務人員培訓課程。"},
{no:"第十九條", body:"依本法進用之社會工作人員及護理人員，其資格應符合相關法律規定。"},
{no:"第二十條", body:"提供延長照顧服務之人員，應具備下列資格之一：\n一、高級中等以下學校或幼兒園（包括幼稚園）合格教師、幼兒園教保員、助理教保員。\n二、曾依中小學兼任代課及代理教師聘任辦法或國民中小學教學支援工作人員聘任辦法聘任之教師。但教學支援工作人員為高級中等以下學校畢業者，應經直轄市、縣（市）教育、社政或勞動相關主管機關自行或委託辦理之一百八十小時課後照顧服務人員專業訓練課程結訓。\n三、公私立大專校院以上學校畢業，並修畢師資培育規定之教育專業課程。\n四、符合兒童及少年福利機構專業人員資格。\n五、高級中等以上學校畢業，並經直轄市、縣（市）教育、社政或勞動相關主管機關自行或委託辦理之一百八十小時課後照顧服務人員專業訓練課程結訓。\n離島、偏遠或原住民族地區遴聘前項資格人員有困難時，得報直轄市、縣（市）主管機關核准，酌減前項第二款或第五款人員之專業訓練課程時數。"},
{no:"第二十一條", body:"公立托兒所改制為公立幼兒園後，原公立托兒所依公務人員任用法任用之人員及依雇員管理規則僱用之人員，於改制後繼續於原機構任用或僱用，其服務、懲戒、考績、訓練、進修、俸給、保險、保障、結社、退休、資遣、撫卹、福利及其他權益事項，依其原適用之相關法令辦理；並得依改制前原適用之組織法規，依規定辦理陞遷及銓敘審定；人事、會計人員之管理，與其他公務人員同。\n公立幼稚園、公立托兒所依本法改制為公立幼兒園，原依行政院與所屬中央及地方各機關約僱人員僱用辦法僱用之人員，及現有工友（含技工、駕駛），依其原適用之相關法令規定辦理。"},
{no:"第二十二條", body:"前條以外公立幼兒園之其他服務人員，依勞動基準法相關規定，以契約進用，契約中應明定其權利義務；其進用程序、考核及待遇等相關事項之辦法，由中央主管機關定之。\n私立教保服務機構之其他服務人員，其勞動條件，依勞動基準法及其他相關法規辦理；法規未規定者，得經直轄市、縣（市）主管機關邀集代表勞資雙方組織協商之。"},
{no:"第二十三條", body:"教保服務機構之其他服務人員有下列情形之一者，教保服務機構應予解聘、免職、終止契約關係或終止運用關係，且終身不得聘任、任用、進用或運用為其他服務人員：\n一、犯性侵害犯罪防治法第二條第一項所定之罪，經有罪判決確定。\n二、經直轄市、縣（市）主管機關調查確認有性侵害行為屬實。\n三、經直轄市、縣（市）主管機關調查確認有性騷擾或性霸凌行為，有解聘、免職、終止契約關係、終止運用關係、終身不得聘任、任用、進用或運用為其他服務人員之必要。\n四、受兒童及少年性剝削防制條例規定處罰，或受性騷擾防治法第二十條或第二十五條規定處罰，經直轄市、縣（市）主管機關確認，有解聘、免職、終止契約關係、終止運用關係、終身不得聘任、任用、進用或運用為其他服務人員之必要。\n五、經各級社政主管機關依兒童及少年福利與權益保障法第九十七條規定處罰，並經直轄市、縣（市）主管機關確認，有解聘、免職、終止契約關係、終止運用關係、終身不得聘任、任用、進用或運用為其他服務人員之必要。\n六、知悉服務之教保服務機構發生疑似性侵害事件，未依第二十六條規定通報，致再度發生機構內性侵害事件；或偽造、變造、湮滅或隱匿他人所犯校園或教保服務機構內性侵害事件之證據，經直轄市、縣（市）主管機關查證屬實。\n七、偽造、變造或湮滅他人所犯校園或教保服務機構毒品危害事件之證據，經直轄市、縣（市）主管機關查證屬實。\n八、體罰、霸凌學生或幼兒，造成其身心嚴重侵害，經直轄市、縣（市）主管機關確認，有解聘、免職、終止契約關係、終止運用關係及終身不得聘任、任用、進用或運用為其他服務人員之必要。\n九、行為違反相關法規，有傷害兒童及少年之虞，經直轄市、縣（市）主管機關查證屬實，有解聘、免職、終止契約關係、終止運用關係、終身不得聘任、任用、進用或運用為其他服務人員之必要。\n十、其他法律規定不得擔任各該人員之情形。"},
{no:"第二十四條", body:"教保服務機構之其他服務人員有下列情形之一者，教保服務機構應予解聘、免職、終止契約關係或終止運用關係，且應認定一年至四年不得聘任、任用、進用或運用為其他服務人員：\n一、經直轄市、縣（市）主管機關調查確認有性騷擾或性霸凌行為，有解聘、免職、終止契約關係或終止運用關係之必要。\n二、受兒童及少年性剝削防制條例規定處罰，或受性騷擾防治法第二十條或第二十五條規定處罰，經直轄市、縣（市）主管機關確認，有解聘、免職、終止契約關係或終止運用關係之必要。\n三、經各級社政主管機關依兒童及少年福利與權益保障法第九十七條規定處罰，並經直轄市、縣（市）主管機關確認，有解聘、免職、終止契約關係或終止運用關係之必要。\n四、體罰、霸凌學生或幼兒，造成其身心侵害，經直轄市、縣（市）主管機關確認，有解聘、免職、終止契約關係或終止運用關係之必要。\n五、行為違反相關法規，有傷害兒童及少年之虞，經直轄市、縣（市）主管機關查證屬實，有解聘、免職、終止契約關係或終止運用關係之必要。"},
{no:"第二十五條", body:"有下列情形之一者，不得聘任、任用、進用或運用為教保服務機構之其他服務人員；已聘任、任用、進用或運用者，教保服務機構應予解聘、免職、終止契約關係或終止運用關係：\n一、有第二十三條各款情形之一。\n二、有前條各款情形之一，於該認定一年至四年期間。\n三、有教保服務人員條例第十二條第三款至第十二款或第十四條第一項第一款所定第十二條第三款至第十二款情形。\n四、有教保服務人員條例第十三條各款或第十四條第一項第二款情形，於該認定一年至四年期間。\n五、有教師法第十四條第一項第三款至第十一款或第十九條第一項第一款所定第十四條第一項第三款至第十一款情形。\n六、有教師法第十五條第一項各款或第十九條第一項第二款情形，於該議決一年至四年期間。\n七、有教師法第十八條第一項情形，於該終局停聘六個月至三年期間。\n八、有性別平等教育法第二十七條之一第一項第一款或第三項前段情形。\n九、有性別平等教育法第二十七條之一第一項第二款或第三項後段情形，於該議決一年至四年期間。\n十、有補習及進修教育法第九條第六項第一款或第二款情形。\n十一、有補習及進修教育法第九條第六項第三款情形，於該認定一年至四年期間。\n有前項各款情形之一，且屬依第二十七條第四項、教保服務人員條例第十六條第四項、教師法第二十條第四項、性別平等教育法第二十七條之一第七項或補習及進修教育法第九條第十二項所定辦法（以下簡稱各通報辦法）規定通報有案者，不得聘任、任用、進用或運用；已聘任、任用、進用或運用者，由教保服務機構逕予解聘、免職、終止契約關係或終止運用關係；非屬依各通報辦法規定通報有案者，教保服務機構應依第二十三條或前條規定辦理，不得聘任、任用、進用或運用；已聘任、任用、進用或運用者，予以解聘、免職、終止契約關係或終止運用關係。"},
{no:"第二十六條", body:"教保服務機構之負責人或其他服務人員於執行業務時，知悉任何人有第二十三條、第二十四條或前條第一項各款、教保服務人員條例第十二條、第十三條或第十四條第一項各款行為之一，除依其他相關法律規定通報外，並應通報直轄市、縣（市）主管機關。"},
{no:"第二十七條", body:"教保服務機構之負責人或其他服務人員有第二十三條、第二十四條或第二十五條第一項規定之情形者，直轄市、縣（市）主管機關及教保服務機構應依規定辦理通報、資訊之蒐集、查詢、處理及利用。\n教保服務機構聘任、任用、進用或運用其他服務人員前，應查詢其有無第二十三條、第二十四條或第二十五條第一項規定之情形，已聘任、任用、進用或運用者，應定期查詢。\n主管機關為協助辦理前項之查詢，得使用中央社政主管機關建立之依性騷擾防治法第二十條或兒童及少年福利與權益保障法第九十七條規定受處罰者之資料庫。\n第二十三條、第二十四條、第二十五條第一項情形之認定、前條及前三項之通報、資訊之蒐集、任職前及任職期間之查詢、處理、利用及其他相關事項之辦法，由中央主管機關定之。"},
{no:"第二十八條", body:"教保服務機構之其他服務人員，有第二十三條、第二十四條或第二十五條第一項各款情形之一，經解聘、免職、終止契約關係或終止運用關係，適用勞動基準法規定且符合該法所定退休條件者，應依法給付退休金。\n教保服務機構之其他服務人員，有第二十三條、第二十四條或第二十五條第一項各款情形之一，且其適用公務人員相關法律者，其免職或撤職，依各該法律規定辦理；其未免職或撤職者，應調離現職。\n教保服務機構之其他服務人員涉有第二十三條或第二十四條情形，於調查期間，教保服務機構應予以暫時停職、停止契約執行或停止運用關係；其原因消滅後復職者，未發給之薪資應依相關規定予以補發。\n前項情形，其他服務人員為適用公務人員相關法律者，其停職及原因消滅後復職本俸（年功俸）之補發，依各該法律規定辦理。"},
{no:"第二十九條", body:"有下列情形之一者，不得擔任教保服務機構之負責人或財團法人幼兒園之董事或監察人：\n一、有第二十三條、第二十四條或第二十五條第一項所列情形。\n二、曾犯內亂、外患罪，經判刑確定或通緝有案尚未結案。\n三、曾服公務因貪污瀆職，經判刑確定或通緝有案尚未結案。\n四、褫奪公權尚未復權。\n五、曾任公務人員受撤職或休職處分，其停止任用或休職期間尚未屆滿。\n六、受破產宣告或依消費者債務清理條例經法院裁定開始清算程序，尚未復權。\n七、無行為能力或限制行為能力。\n八、受輔助宣告尚未撤銷。\n私人設立未辦理財團法人登記之私立教保服務機構，其負責人有前項第一款情形者，直轄市、縣（市）主管機關應廢止其設立許可；公立幼兒園、非營利幼兒園、財團法人私立教保服務機構、法人、團體、醫院或商業附設之私立教保服務機構、私立學校附設或附屬之私立教保服務機構推派之負責人或財團法人幼兒園之董事或監察人有前項第一款情形者，直轄市、縣（市）主管機關應令其更換。\n負責人、董事或監察人有第一項第一款情事者，其認定、通報、資訊之蒐集、任職前及任職期間之查詢、處理、利用及其他相關事項之辦法，由中央主管機關定之。"},
{no:"第三十條", body:"教保服務機構之負責人及其他服務人員，不得對幼兒有身心虐待、體罰、霸凌、性騷擾、不當管教，或其他對幼兒之身心暴力或不當對待之行為。\n教保服務機構之負責人或其他服務人員依第二十六條通報直轄市、縣（市）主管機關，至遲不得超過二十四小時。\n直轄市、縣（市）主管機關知悉負責人或其他服務人員疑似有第二十三條、第二十四條、第二十五條第一項各款及第一項情形後，應於二個工作日內，交由所設之委員會調查處理；另將調查處理結果以書面載明事實及理由，通知行為人及事件關係幼兒之法定代理人或實際照顧者。\n前項委員會，應包括主管機關代表、具兒童保護意識之教保與兒童福利團體代表、教保服務人員團體代表、其他服務人員代表、家長團體代表及相關領域學者專家；其委員會組成、調查處理程序及其他相關事項之辦法，由中央主管機關定之。\n依本法進行第三項調查時，行為人及教保服務機構其他相關之人，應配合調查。\n教保服務機構應就下列事項訂定管理規定、確實執行，並定期檢討改進：\n一、環境、食品安全與衛生及疾病預防。\n二、安全管理。\n三、定期檢修各項設施安全。\n四、各項安全演練措施。\n五、緊急事件處理機制。"},
{no:"第三十一條", body:"幼兒進入及離開教保服務機構時，該機構應實施保護措施，確保其安全。\n幼兒園接送幼兒，應以經直轄市、縣（市）主管機關核准之幼童專用車輛為之，車齡不得逾出廠十年；其規格、標識、顏色、載運人數應符合法令規定，並經公路監理機關檢驗合格；該車輛之駕駛人應具有職業駕駛執照，並配置具教保服務人員資格，或成年人擔任隨車人員隨車照護，維護接送安全。\n前項幼童專用車輛、駕駛人及其隨車人員之督導管理及其他應遵行事項之辦法，由中央主管機關會同交通部定之。\n幼兒園新進用之駕駛人及隨車人員，應於任職前二年內，或任職後三個月內，接受基本救命術訓練八小時以上；任職後每二年應接受基本救命術訓練八小時以上、安全教育（含交通安全）相關課程三小時以上及緊急救護情境演習一次以上。直轄市、縣（市）主管機關應至少每季辦理相關訓練、課程或演習，幼兒園應予協助。"},
{no:"第三十二條", body:"教保服務機構應建立幼兒健康管理制度。直轄市、縣（市）衛生主管機關辦理幼兒健康檢查時，教保服務機構應予協助，並依檢查結果，施予健康指導或轉介治療。\n教保服務機構應將幼兒健康檢查、疾病檢查結果、轉介治療及預防接種等資料，載入幼兒健康資料檔案，並妥善管理及保存。\n前項預防接種資料，父母或監護人應於幼兒入園或學年開始後一個月內提供教保服務機構。\n父母或監護人未提供前項資料者，教保服務機構應通知父母或監護人提供；父母或監護人未於接獲通知一個月內提供者，教保服務機構應通知衛生主管機關。\n教保服務機構、負責人及其他服務人員，對幼兒資料應予保密。但經父母或監護人同意或依其他法律規定應予提供者，不在此限。"},
{no:"第三十三條", body:"教保服務機構為適當處理幼兒緊急傷病，應訂定施救步驟、護送就醫地點，呼叫緊急救護專線支援之注意事項及父母或監護人未到達前之處理措施等規定。\n幼兒園應依第八條第六項之基本設施設備標準設置保健設施，作為健康管理、緊急傷病處理、衛生保健、營養諮詢及協助健康教學之資源。\n幼兒園之護理人員，每二年應接受教學醫院或主管機關認可之機構、學校或團體辦理之救護技術訓練八小時。"},
{no:"第三十四條", body:"教保服務機構應依高級中等以下學校學生及教保服務機構幼兒團體保險條例及其相關規定，辦理幼兒團體保險。\n幼兒申請理賠時，教保服務機構應主動協助辦理。\n各級主管機關應為所轄之教保服務機構投保場所公共意外責任保險，其經費，由中央主管機關按年度編列預算支應之。"},
{no:"第三十五條", body:"幼兒園得成立家長會；其屬國民中、小學附設者，併入該校家長會辦理。\n前項家長會得加入地區性家長團體。\n幼兒園家長會之任務、組織、運作及其他相關事項之自治法規，由直轄市、縣（市）主管機關定之。"},
{no:"第三十六條", body:"父母或監護人及家長團體，得請求直轄市、縣（市）主管機關提供下列資訊，該主管機關不得拒絕：\n一、教保服務政策。\n二、教保服務品質監督之機制及作法。\n三、許可設立之教保服務機構名冊。\n四、教保服務機構收退費之相關規定及收費數額。\n五、幼兒園評鑑報告及結果。"},
{no:"第三十七條", body:"教保服務機構應公開下列資訊：\n一、教保目標及內容。\n二、教保服務人員及其他服務人員之學（經）歷、證照。\n三、衛生、安全及緊急事件處理措施。\n四、依第十六條及第十七條規定設置行政組織及員額編制情形。\n五、依第三十四條第一項規定辦理幼兒團體保險之情形。\n六、第四十三條第四項所定收退費基準、收費項目及數額、減免收費之規定。\n七、核定之招收人數及實際招收人數。"},
{no:"第三十八條", body:"父母或監護人對教保服務機構提供之教保服務方式及內容有異議時，得請求教保服務機構提出說明，教保服務機構無正當理由不得拒絕，並視需要修正或調整之。"},
{no:"第三十九條", body:"直轄市、縣（市）層級家長團體及教保服務人員組織，得參與直轄市、縣（市）主管機關對幼兒園評鑑之規劃。"},
{no:"第四十條", body:"教保服務機構之教保服務有損及幼兒權益者，其父母或監護人，得向教保服務機構提出異議，不服教保服務機構之處理時，得於知悉處理結果之日起三十日內，向教保服務機構所在地之直轄市、縣（市）主管機關提出申訴，不服主管機關之評議決定者，得依法提起訴願或訴訟。\n直轄市或縣（市）主管機關為評議前項申訴事件，應召開申訴評議會；其成員應包括主管機關代表、教保與兒童福利團體代表、教保服務人員團體代表、家長團體代表、教保服務機構行政人員代表及法律、教育、兒童福利、心理或輔導學者專家，其中非機關代表人員不得少於成員總數二分之一，任一性別成員應占成員總數三分之一以上；其組織及評議等相關事項之自治法規，由直轄市、縣（市）主管機關定之。"},
{no:"第四十一條", body:"父母或監護人應履行下列義務：\n一、依教保服務契約規定繳費。\n二、參加教保服務機構因其幼兒特殊需要所舉辦之個案研討會或相關活動。\n三、參加教保服務機構所舉辦之親職活動。\n四、告知幼兒特殊身心健康狀況，必要時並提供相關健康狀況資料，並與教保服務機構協力改善幼兒之身心健康。\n各級主管機關對有前項第四款幼兒之父母或監護人，應主動提供資源協助之。"},
{no:"第四十二條", body:"教保服務機構受託提供教保服務，應與幼兒之父母或監護人訂定書面契約。\n前項書面契約之格式、內容，中央主管機關應訂定書面契約範本供參。\n幼兒園有違反第八條第六項所定辦法有關招收人數之限制規定，父母或監護人得於知悉後三十日內，以書面通知幼兒園終止契約，幼兒園應就當學期已收取之費用返還父母或監護人，不受依第四十三條第二項或第六項所定退費基準之限制。"},
{no:"第四十三條", body:"教保服務機構之收費項目及用途由中央主管機關定之。\n公立幼兒園收退費基準之自治法規，由直轄市、縣（市）主管機關依前項所定收費項目及用途定之。\n私立教保服務機構得考量其營運成本，依第一項中央主管機關所定之收費項目及用途訂定收費數額，於每學年度開始前對外公布，並報直轄市、縣（市）主管機關備查後，向就讀幼兒之父母或監護人收取費用。\n教保服務機構之收退費基準、收費項目及數額、減免收費規定，應至少於每學期開始前一個月公告之。\n前項收退費基準、收費項目及數額、減免收費規定，直轄市、縣（市）主管機關應主動於資訊網站公開其訂定或備查之內容。\n幼兒因故無法繼續就讀而離開教保服務機構者，教保服務機構應依其就讀期間退還父母或監護人所繳費用；其退費項目及基準之自治法規，由直轄市、縣（市）主管機關定之。\n前六項收退費項目、數額、減免及收退費基準，應包括第十二條第三項及第四項所定之教保服務、延長照顧服務及臨時照顧服務。"},
{no:"第四十四條", body:"直轄市、縣（市）主管機關對主管之教保服務機構，其優先招收離島、偏遠地區，或經濟、身心、文化與族群之需要協助幼兒，應提供適切之協助或補助。\n前項協助或補助之辦法，由中央主管機關定之。"},
{no:"第四十五條", body:"教保服務機構各項經費收支保管及運用，應設置專帳處理；其收支應有合法憑證，並依規定年限保存。\n私立教保服務機構會計帳簿與憑證之設置、取得、保管及其他應遵行事項，應依相關稅法規定辦理。\n法人附設教保服務機構之財務應獨立。"},
{no:"第四十六條", body:"直轄市、縣（市）主管機關應對教保服務機構辦理檢查及輔導，並應對幼兒園辦理評鑑；其評鑑報告及結果，應公布於資訊網站。\n教保服務機構對前項檢查、評鑑不得規避、妨礙或拒絕。\n第一項評鑑類別、評鑑項目、評鑑指標、評鑑對象、評鑑人員資格與培訓、實施方式、結果公布、申復、申訴及追蹤評鑑等相關事項之辦法，由中央主管機關定之。"},
{no:"第四十七條", body:"教保服務機構辦理績效卓著者，直轄市、縣（市）主管機關應予以獎勵；其獎勵事項、對象、種類、方式之自治法規，由直轄市、縣（市）主管機關定之。"},
{no:"第四十八條", body:"中華民國一百年十二月三十一日以前，已依兒童及少年福利法許可兼辦國民小學兒童課後照顧服務之托兒所，於一百零一年一月一日以後，改制為幼兒園者，得繼續兼辦之。\n中華民國一百零一年一月一日以後，幼兒園於提供教保服務外，其原設立許可之空間有空餘，且主要空間可明確區隔者，得報直轄市、縣（市）主管機關核准後，將原設立許可幼兒園幼兒總招收人數二分之一以下之名額，轉為兼辦國民小學階段兒童課後照顧服務之兒童人數，招收兒童進行課後照顧服務，並不得停止辦理幼兒園之教保服務。\n前項兼辦國民小學階段兒童課後照顧服務之幼兒園，其服務內容、人員資格及收退費規定，準用兒童課後照顧服務班與中心設立及管理辦法之規定；有購置或租賃交通車載運兒童之需要者，應準用學生交通車管理辦法相關規定辦理。\n第一項及第二項核准條件、人員編制、管理、設施設備及其他應遵行事項之辦法，由中央主管機關定之。"},
{no:"第四十九條", body:"負責人不得以非教保團體代表之身分，擔任教保服務諮詢會、審議會及申訴評議會之委員。\n違反前項規定者，主管機關應重新聘任。\n審議會、申訴評議會委員之迴避，依行政程序法之規定辦理。"},
{no:"第五十條", body:"教保服務機構之負責人或其他服務人員，違反第三十條第一項規定，對幼兒有下列情形之一者，處行為人新臺幣六萬元以上六十萬元以下罰鍰，並公布行為人之姓名及機構名稱：\n一、身心虐待。\n二、情節重大之體罰、霸凌、性騷擾、不當管教、其他身心暴力或不當對待之行為。"},
{no:"第五十一條", body:"有下列情形之一者，處負責人或行為人新臺幣六萬元以上三十萬元以下罰鍰，並令其停辦；其拒不停辦者，並得按次處罰：\n一、違反第八條第一項規定，未經許可設立，即招收幼兒或進行教保服務。\n二、違反第十條第二項至第四項規定，未經許可設立，即招收幼兒或進行教保服務。\n三、違反第四十八條第二項規定，未經核准，即招收兒童或進行課後照顧服務。\n有前項各款情形之一者，直轄市、縣（市）主管機關並應公布場所地址及負責人或行為人之姓名。"},
{no:"第五十二條", body:"幼兒園有下列情形之一者，處負責人新臺幣六萬元以上三十萬元以下罰鍰，並令幼兒園限期改善，屆期仍未改善者，得按次處罰；其情節重大或經處罰三次後仍未改善者，得依情節輕重為一定期間減少招收人數、停止招生六個月至一年、停辦一年至三年或廢止設立許可之處分：\n一、違反第八條第六項所定辦法有關招收人數之限制規定，且超收幼兒人數逾十五人或檢查時藏匿幼兒。\n二、違反第十六條第一項有關班級人數之規定，或第四項有關每班配置教保服務人員之規定。\n三、違反第二十三條至第二十五條或第二十八條第三項規定，知悉園內有不得於教保服務機構服務之其他服務人員而未依規定處理。\n四、違反第二十九條第二項規定，教保服務機構之負責人、董事或監察人有不得擔任該項職務之情形而未予以更換。\n五、違反第三十四條第一項規定，未辦理幼兒團體保險。\n六、未依第四十二條第三項規定返還費用、違反第四十三條第三項規定，未將收費數額報直轄市、縣（市）主管機關備查、以超過備查之數額及項目收費，或未依第四十三條第六項所定自治法規退費。\n七、違反第四十六條第二項規定，規避、妨礙或拒絕檢查或評鑑。\n八、違反依第四十六條第三項所定辦法有關評鑑結果列入應追蹤評鑑，且經追蹤評鑑仍未改善。"},
{no:"第五十三條", body:"提供社區、部落或職場互助式教保服務之機構，有下列情形之一者，處負責人新臺幣六萬元以上三十萬元以下罰鍰，並令機構限期改善，屆期仍未改善者，得按次處罰；其情節重大或經處罰三次後仍未改善者，得依情節輕重為一定期間減少招收人數、停止招生六個月至一年、停辦一年至三年或廢止設立許可之處分：\n一、違反第二十三條至第二十五條或第二十八條第三項規定，知悉機構內有不得於教保服務機構服務之其他服務人員而未依規定處理。\n二、違反第二十九條第二項規定，教保服務機構之負責人、董事或監察人有不得擔任該項職務之情形而未予以更換。\n三、違反第三十四條第一項規定，未辦理幼兒團體保險。\n四、違反第四十三條第三項規定，未將收費數額報直轄市、縣（市）主管機關備查、以超過備查之數額或項目收費，或未依第四十三條第六項所定自治法規退費。\n五、違反第四十六條第二項規定，規避、妨礙或拒絕檢查。"},
{no:"第五十四條", body:"教保服務機構有下列情形之一者，處負責人新臺幣五萬元以上二十五萬元以下罰鍰，並令教保服務機構限期改善，屆期仍未改善者，得按次處罰；必要時並得為令其停止招生或廢止設立許可之處分：\n一、違反第十五條規定，未於進用教職員工後三十個工作日內報備查。\n二、違反第二十七條第二項規定，未於聘任、任用、進用或運用其他服務人員前辦理查詢。\n教保服務機構之負責人或其他服務人員，違反第二十六條規定者，處新臺幣三萬元以上十五萬元以下罰鍰。"},
{no:"第五十五條", body:"教保服務機構、負責人或其他服務人員，違反第三十二條第五項規定者，處負責人或其他服務人員新臺幣三萬元以上十五萬元以下罰鍰，並得按次處罰。"},
{no:"第五十六條", body:"幼兒園有下列情形之一者，處負責人新臺幣九千元以上九萬元以下罰鍰，並令幼兒園限期改善，屆期仍未改善者，得按次處罰；其情節重大或經處罰三次後仍未改善者，得依情節輕重為一定期間減少招收人數、停止招生六個月至一年、停辦一年至三年或廢止設立許可之處分：\n一、違反第八條第六項所定標準或辦法有關設施設備或招收人數之限制規定。\n二、違反第二十條第一項規定，進用未符資格之服務人員。\n三、違反第三十一條第二項規定，以未經核准之幼童專用車輛載運幼兒、車齡逾十年、載運人數不符合法令規定、配置之隨車人員未具教保服務人員資格或未成年。\n四、違反依第三十一條第三項所定辦法有關幼童專用車輛車身顏色與標識、接送幼兒、駕駛人或隨車人員之規定。\n五、違反第四十八條第二項規定，停止辦理幼兒園之教保服務。\n六、違反第四十八條第三項準用兒童課後照顧服務班與中心設立及管理辦法所定服務內容、人員資格或收退費之規定。\n七、違反第四十八條第三項準用學生交通車管理辦法規定，以未經核准或備查之車輛載運兒童，或違反有關學生交通車車輛車齡、車身顏色與標識、載運人數核定數額、接送兒童、駕駛人或隨車人員之規定。\n八、違反依第四十八條第四項所定辦法有關人員編制、管理或設施設備之規定。"},
{no:"第五十七條", body:"提供社區、部落或職場互助式教保服務之機構，有下列情形之一者，處負責人新臺幣九千元以上九萬元以下罰鍰，並令機構限期改善，屆期仍未改善者，得按次處罰；其情節重大或經處罰三次後仍未改善者，得依情節輕重為一定期間減少招收人數、停止招生六個月至一年、停辦一年至三年或廢止設立許可之處分：\n一、違反依第十條第五項所定辦法有關招收人數、人員資格與配置、收退費、環境、設施與設備、衛生保健、檢查、管理之強制或禁止規定。\n二、違反第二十條第一項規定，進用未符資格之服務人員。"},
{no:"第五十八條", body:"教保服務機構有下列情形之一者，處負責人新臺幣六千元以上六萬元以下罰鍰，並令教保服務機構限期改善，屆期仍未改善者，得按次處罰；其情節重大或經處罰三次後仍未改善者，得依情節輕重為一定期間減少招收人數、停止招生六個月至一年、停辦一年至三年或廢止設立許可之處分：\n一、違反依第八條第六項所定標準有關幼兒園之使用樓層、必要設置空間與總面積、室內與室外活動空間面積數、衛生設備高度與數量，及所定辦法有關幼兒園改建、遷移、擴充、更名、變更負責人或停辦之規定。\n二、違反依第十二條第五項所定準則有關衛生保健之強制規定或教保及照顧服務之禁止規定。\n三、違反第十五條規定，未於教職員工異動後三十個工作日內報備查。\n四、違反第十六條第三項有關配置專任教保服務人員之規定，或違反第五項有關公立學校附設幼兒園應增置教保服務人員之規定。\n五、違反第十七條第一項規定，五歲至入國民小學前幼兒之班級未配置教師。\n六、違反第十七條第二項規定，幼兒園助理教保員之人數超過園內教保服務人員總人數之三分之一。\n七、違反第十七條第四項有關置護理人員之規定，或違反依第七項所定標準有關置廚工之規定。\n八、違反依第二十七條第四項、第二十九條第三項所定辦法有關教保服務機構辦理認定、通報、資訊之蒐集、任職前及任職期間之查詢、處理及利用之強制或禁止規定。\n九、教保服務機構之其他服務人員有違反第三十條第一項規定之情形。\n十、違反第三十三條第一項規定，未訂定注意事項及處理措施。\n十一、經營許可設立以外之業務。\n教保服務機構之負責人或其他服務人員違反第三十條第一項規定，對幼兒有非屬情節重大之體罰、霸凌、性騷擾、不當管教、其他身心暴力或不當對待之行為，處行為人新臺幣六千元以上六萬元以下罰鍰，並公布行為人之姓名及機構名稱。\n行為人及教保服務機構其他相關之人，違反第三十條第五項不配合調查，而無正當理由者，處新臺幣六千元以上六萬元以下罰鍰，並得按次處罰至其配合為止。"},
{no:"第五十九條", body:"教保服務機構有下列情形之一者，處負責人新臺幣三千元以上一萬五千元以下罰鍰，並令教保服務機構限期改善，屆期仍未改善者，得按次處罰；其情節重大或經處罰三次後仍未改善者，得依情節輕重為一定期間減少招收人數、停止招生六個月至一年、停辦一年至三年或廢止設立許可之處分：\n一、違反第三十條第六項規定，未訂定管理規定、未確實執行，或未定期檢討改進。\n二、違反第三十一條第一項規定，未於幼兒進入及離開教保服務機構時，實施保護措施。\n三、違反第三十二條第一項規定，未建立幼兒健康管理制度。\n四、違反第三十二條第二項規定，未將幼兒健康檢查、疾病檢查結果、轉介治療及預防接種等資料，載入幼兒健康資料檔案，或未妥善管理及保存。\n五、違反第三十二條第四項規定，未通知父母或監護人提供預防接種資料，或未依規定通知衛生主管機關。\n六、違反第三十三條第二項規定，未依第八條第六項之基本設施設備標準設置保健設施。\n七、違反第三十四條第二項規定，未主動協助辦理幼兒團體保險理賠。\n八、違反第三十七條規定，未公開資訊。\n九、違反第三十八條規定，無正當理由拒絕向父母或監護人說明教保服務內容及方式。\n十、違反第四十二條第一項規定，未與幼兒之父母或監護人訂定書面契約。\n十一、違反第四十三條第四項規定，未於每學期開始前一個月公告收退費基準、收費項目及數額、減免收費規定。\n十二、違反第四十五條第一項規定，未設置專帳、其收支無合法憑證，或未依規定年限保存。\n十三、違反第四十五條第二項規定，未依相關稅法規定辦理。\n十四、違反第四十五條第三項規定，法人附設教保服務機構之財務未獨立。"},
{no:"第六十條", body:"駕駛人、隨車人員或護理人員有下列情形之一者，應令其限期改善，屆期仍未改善者，處新臺幣一千元以上六千元以下罰鍰，並得按次處罰：\n一、違反第三十一條第四項規定，未於規定期限內接受基本救命術訓練八小時以上、安全教育（含交通安全）相關課程三小時以上或緊急救護情境演習一次以上。\n二、違反第三十三條第三項規定，未每二年接受救護技術訓練八小時。\n有前項各款情形之一，係因不可歸責於該駕駛人、隨車人員或護理人員之事由所致，並經直轄市、縣（市）主管機關查證屬實者，不予處罰。\n前項情形可歸責於幼兒園者，應令幼兒園限期改善，屆期仍未改善者，處負責人新臺幣一千元以上六千元以下罰鍰，並得按次處罰；其情節重大或經處罰三次後仍未改善者，得依情節輕重為一定期間減少招收人數、停止招生六個月至一年、停辦一年至三年或廢止設立許可之處分。"},
{no:"第六十一條", body:"本法所定令限期改善及處罰，由直轄市、縣（市）主管機關為之；直轄市、縣（市）主管機關並得依行政罰法第十八條第二項規定辦理。\n教保服務機構違反本法規定，經直轄市、縣（市）主管機關處以罰鍰、減少招收人數、停止招生、停辦或廢止設立許可者，直轄市、縣（市）主管機關應公布其名稱及負責人姓名。\n教保服務機構為法人，經直轄市、縣（市）主管機關廢止設立許可者，直轄市、縣（市）主管機關應通知法院令其解散。\n依第五十條、第五十一條第二項、第五十八條第二項及第二項公布負責人、行為人、機構名稱及場址者，其公布期間，由中央主管機關定之。"},
{no:"第六十二條", body:"中華民國一百年十二月三十一日以前之公立托兒所或經政府許可設立、核准立案之私立托兒所，已依本法改制為幼兒園者，其五歲至入國民小學前幼兒之班級，至遲應於一百十四年八月一日起符合第十七條第一項所定，每班配置之教保服務人員應有一人以上為幼兒園教師之規定。\n中華民國一百年十二月三十一日以前之公立托兒所，其未依本法一百零七年六月二十七日修正公布條文施行前第五十五條第一項規定改制為幼兒園經廢止設立許可者，中央主管機關應視其財力補助直轄市、縣（市）主管機關於其所在地或鄰近地區設置公立幼兒園或非營利幼兒園。"},
{no:"第六十三條", body:"中華民國一百年十二月三十一日以前，已依建築法取得 F-3 使用類組（托兒所或幼稚園）之建造執照、使用執照，或已依私立兒童及少年福利機構設立許可及管理辦法規定取得籌設許可之托兒所，或依幼稚教育法規定取得籌設許可之幼稚園，自一百零一年一月一日起至一百零二年十二月三十一日止之期間內，得依取得或籌設時之設施設備規定申請幼兒園設立許可，其餘均應依第八條第六項設施設備之規定辦理。"},
{no:"第六十四條", body:"各級主管機關為瞭解與規劃幼兒接受教保服務或補助情形、教保服務機構員額配置或人員進用，得蒐集、處理或利用學前教育階段幼兒及人員之個人資料，並建立相關資料庫。"},
{no:"第六十五條", body:"本法施行細則，由中央主管機關定之。"},
{no:"第六十六條", body:"本法施行日期，由行政院定之。"},
];

const LAW_TBC = [
{no:"第一條", body:"為規範教保服務人員之培育、資格、權益、管理、申訴及爭議處理等事項，提升教保服務人員專業地位，特制定本條例。"},
{no:"第二條", body:"本條例所稱主管機關：在中央為教育部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。"},
{no:"第三條", body:"本條例所稱教保服務人員，指幼兒教育及照顧法（以下簡稱幼照法）第三條第五款所定提供教保服務之園長、教師、教保員及助理教保員。"},
{no:"第四條", body:"中央主管機關掌理下列事項：\n一、教保服務人員政策及法規之研擬或訂定。\n二、教保服務人員人力規劃、培育及人才庫之建立。\n三、教保服務人員權益之保障。\n四、其他全國性教保服務人員之相關事項。"},
{no:"第五條", body:"直轄市、縣（市）主管機關掌理下列事項：\n一、教保服務人員自治法規之研擬或訂定。\n二、教保服務人員之監督、輔導、管理及在職訓練。\n三、其他地方性教保服務人員之相關事項。"},
{no:"第六條", body:"幼兒園園長，應同時具備下列各款資格：\n一、具幼兒園教師或教保員資格。\n二、在教保服務機構（包括托兒所及幼稚園）擔任教師、教保員，或幼兒教育、幼兒保育相關科、系、所畢業之負責人，並實際服務滿五年以上。\n三、經直轄市、縣（市）主管機關自行或委託設有經中央主管機關認可之幼兒教育、幼兒保育相關科、系、所、學位學程之專科以上學校辦理之幼兒園園長專業訓練及格。\n除前項規定外，具備下列資格之一者，亦取得幼兒園園長資格：\n一、中華民國一百年十二月三十一日以前經直轄市、縣（市）主管機關依法核定在案之托兒所所長及幼稚園園長，且於一百零一年一月一日仍繼續在職，並轉換其職稱為幼兒園園長。\n二、一百年十二月三十一日以前經直轄市、縣（市）主管機關依法核定在案之托兒所所長、幼稚園園長、已修畢兒童福利專業人員訓練實施方案戊類訓練課程，或已依兒童及少年福利機構專業人員資格及訓練辦法規定修畢托育機構主管核心課程並領有結業證書，且符合特定再任職情形者，得申請取得園長資格。\n（詳細採計年資、備查程序等規定，請參全國法規資料庫本條全文。）"},
{no:"第七條", body:"公立幼兒園園長，應由現職教師或現職契約進用教保員擔任。\n直轄市、縣（市）主管機關、鄉（鎮、市）公所及直轄市山地原住民區公所，得依特定規定任用公立幼兒園園長，不受前項及第二十五條第四項有關園長遴選、聘任、聘期規定之限制。\n私立幼兒園園長，由董事會遴選合格人員聘任；未設董事會者，由負責人遴選合格人員聘任，並均應報請所在地直轄市、縣（市）主管機關核定。"},
{no:"第八條", body:"中央主管機關應依幼兒園教師總量需求，適量培育。\n幼兒園教師資格之取得，應採職前培育及在職進修方式為之。\n幼兒園教師培育及資格之取得，除本條例另有規定外，依師資培育法規定辦理；教師資格於師資培育法相關規定未修正前，適用幼稚園教師資格之規定。\n除前項規定外，於中華民國一百年十二月三十一日以前已取得幼稚園教師資格，且於一百零一年一月一日仍在職，並轉換其職稱為幼兒園教師者，亦取得幼兒園教師資格。\n國內大學設有幼兒教育、幼兒保育相關學系，並依第十條第三項規定經中央主管機關認可者，得依師資培育法及相關規定，申請認定為師資培育相關學系，培育幼兒園教師。\n曾於依第十條第三項規定經中央主管機關認可之國內專科以上學校設有幼兒教育、幼兒保育相關系、所、學位學程、科、輔系、學分學程修畢幼兒園教保專業課程者，於師資培育之大學修畢幼兒園師資職前教育課程中教保專業課程以外之教育專業課程，取得修畢師資職前教育證明書後，具參加幼兒園教師資格檢定之資格。\n幼兒園教師師資培育相關學系之認定、師資職前教育課程內容及教師資格檢定方式，應符合幼兒園教保服務之專業需求。"},
{no:"第九條", body:"中央主管機關得協調師資培育之大學，辦理幼兒園師資職前教育課程，提供於幼兒園實際從事教保服務工作滿三年且現職之園長、教保員進修機會。\n前項人員修畢幼兒園師資職前教育課程成績及格者，由師資培育之大學發給修畢師資職前教育證明書，其具有大學畢業學歷，通過教師資格考試且修習教育實習成績及格者，由中央主管機關發給教師證書。但最近七年內於幼兒園（包括托兒所、幼稚園）任園長、教保員累計滿三年以上，表現優良，經教學演示及格者，得免教育實習。\n本條例施行前，已依師資培育法規定修習幼兒園師資職前教育課程，且於本條例施行後仍在職者，得準用前項免教育實習之規定。\n第一項及第二項應修課程、招生、免教育實習之認定及其他相關事項之辦法，由中央主管機關定之。"},
{no:"第十條", body:"教保員應具備下列資格之一：\n一、修畢經中央主管機關認可之國內專科以上學校教保相關系科之幼兒園教保專業課程且取得專科以上學校畢業證書。\n二、具備國外專科以上學校幼兒教育、幼兒保育相關系、所、學位學程、科畢業證書，並取得經中央主管機關發給之修畢教保專業課程證明書。\n除前項規定外，具備特定過渡條件者，亦取得教保員資格（詳見全國法規資料庫本條第2項）。\n第一項第一款國內專科以上學校教保相關系科之師資、設施、招生名額、課程之設置基準、學分抵免、審議、認可、廢止認可及其他相關事項之辦法，由中央主管機關定之。\n中央主管機關得自行或委託學術團體或專業評鑑機構，定期辦理教保相關系科評鑑，並公告其結果，作為核定、調整各教保相關系科招生名額及廢止認可之參考。\n教保相關系科之學生，其入學資格及修業年限，依大學法及專科學校法之規定。"},
{no:"第十一條", body:"助理教保員，應修畢國內高級中等學校幼兒保育相關學程、科之課程，並取得畢業證書。\n除前項規定外，具備特定過渡條件者，亦取得助理教保員資格（詳見全國法規資料庫本條第2項）。\n第一項相關學程及科之認定標準，由中央主管機關定之。"},
{no:"第十二條", body:"教保服務人員有下列情形之一者，教保服務機構應予解聘、免職或終止契約關係，且終身不得聘任、任用或進用為教保服務人員：\n一、動員戡亂時期終止後，犯內亂、外患罪，經有罪判決確定。\n二、服公務，因貪污行為經有罪判決確定。\n三、犯性侵害犯罪防治法第二條第一項所定之罪，經有罪判決確定。\n四、經直轄市、縣（市）主管機關調查確認有性侵害行為屬實。\n五、經直轄市、縣（市）主管機關調查確認有性騷擾或性霸凌行為，有解聘、免職、終止契約關係、終身不得聘任、任用或進用為教保服務人員之必要。\n六、受兒童及少年性剝削防制條例規定處罰，或受性騷擾防治法第二十條或第二十五條規定處罰，經直轄市、縣（市）主管機關確認，有解聘、免職、終止契約關係、終身不得聘任、任用或進用為教保服務人員之必要。\n七、經各級社政主管機關依兒童及少年福利與權益保障法第九十七條規定處罰，並經直轄市、縣（市）主管機關確認，有解聘、免職、終止契約關係、終身不得聘任、任用或進用為教保服務人員之必要。\n八、知悉服務之教保服務機構發生疑似性侵害事件，未依第十五條規定通報，致再度發生機構內性侵害事件；或偽造、變造、湮滅或隱匿他人所犯校園或教保服務機構內性侵害事件之證據，經直轄市、縣（市）主管機關查證屬實。\n九、偽造、變造或湮滅他人所犯校園或教保服務機構毒品危害事件之證據，經直轄市、縣（市）主管機關查證屬實。\n十、體罰、霸凌學生或幼兒，造成其身心嚴重侵害，經直轄市、縣（市）主管機關確認，有解聘、免職、終止契約關係、終身不得聘任、任用或進用為教保服務人員之必要。\n十一、行為違反相關法規，有傷害兒童及少年之虞，經直轄市、縣（市）主管機關查證屬實，有解聘、免職、終止契約關係、終身不得聘任、任用或進用為教保服務人員之必要。\n十二、其他法律規定不得擔任各該人員之情形。"},
{no:"第十三條", body:"教保服務人員有下列情形之一者，教保服務機構應予解聘、免職或終止契約關係，且應認定一年至四年不得聘任、任用或進用為教保服務人員：\n一、經直轄市、縣（市）主管機關調查確認有性騷擾或性霸凌行為，有解聘、免職或終止契約關係之必要。\n二、受兒童及少年性剝削防制條例規定處罰，或受性騷擾防治法第二十條或第二十五條規定處罰，經直轄市、縣（市）主管機關確認，有解聘、免職或終止契約關係之必要。\n三、經各級社政主管機關依兒童及少年福利與權益保障法第九十七條規定處罰，並經直轄市、縣（市）主管機關確認，有解聘、免職或終止契約關係之必要。\n四、體罰、霸凌學生或幼兒，造成其身心侵害，經直轄市、縣（市）主管機關確認，有解聘、免職或終止契約關係之必要。\n五、行為違反相關法規，有傷害兒童及少年之虞，經直轄市、縣（市）主管機關查證屬實，有解聘、免職或終止契約關係之必要。"},
{no:"第十四條", body:"有下列情形之一者，不得聘任、任用或進用為教保服務人員；已聘任、任用或進用者，教保服務機構應予以解聘、免職或終止契約關係：\n一、有第十二條各款情形。\n二、有前條各款情形，於該認定一年至四年期間。\n三、有幼照法第二十三條各款、第二十五條第一項第一款情形。\n四、有幼照法第二十四條各款、第二十五條第一項第二款情形，於該認定一年至四年期間。\n五、有教師法第十四條第一項各款、第十九條第一項第一款情形。\n六、有教師法第十五條第一項各款、第十九條第一項第二款情形，於該議決一年至四年期間。\n七、有教師法第十八條第一項情形，於該終局停聘六個月至三年期間。\n八、有性別平等教育法第二十七條之一第一項第一款、第三項前段情形。\n九、有性別平等教育法第二十七條之一第一項第二款、第三項後段情形，於該議決一年至四年期間。\n十、有補習及進修教育法第九條第六項第一款及第二款情形。\n十一、有補習及進修教育法第九條第六項第三款情形，於該認定一年至四年期間。\n有前項各款情形之一，且屬依第十六條第四項、幼照法第二十七條第四項、教師法第二十條第四項、性別平等教育法第二十七條之一第七項或補習及進修教育法第九條第十二項所定辦法規定之通報有案者，不得聘任、任用或進用；已聘任、任用或進用者，由教保服務機構逕予解聘、免職或終止契約關係。"},
{no:"第十五條", body:"教保服務人員於執行業務時，知悉任何人有第十二條、第十三條或前條第一項各款、幼照法第二十三條、第二十四條或第二十五條第一項各款行為之一，除依其他相關法律規定通報外，並應通報直轄市、縣（市）主管機關。"},
{no:"第十六條", body:"教保服務人員有第十二條、第十三條或第十四條第一項規定之情形者，直轄市、縣（市）主管機關及教保服務機構應依規定辦理通報、資訊之蒐集、查詢、處理及利用。\n教保服務機構聘任、任用或進用教保服務人員前，應查詢其有無第十二條、第十三條或第十四條第一項規定之情形，已聘任、任用或進用者，應定期查詢。\n主管機關為協助辦理前項之查詢，得使用中央社政主管機關建立之依性騷擾防治法第二十條或兒童及少年福利與權益保障法第九十七條規定受處罰者之資料庫。\n第十二條、第十三條、第十四條第一項情形之認定、前條及前三項情形之通報、資訊之蒐集、任職前及任職期間之查詢、處理、利用及其他相關事項之辦法，由中央主管機關定之。"},
{no:"第十七條", body:"教保服務人員有第十二條、第十三條或第十四條第一項各款情形之一，經解聘、免職或終止契約關係之人員，適用勞動基準法規定且符合該法所定退休條件者，應依法給付退休金。\n教保服務人員有第十二條、第十三條或第十四條第一項各款情形之一，且其為準用教師法之公立幼兒園教師或適用公務人員相關法律者，其解聘、免職或撤職，依各該法律規定辦理；其未解聘、免職或撤職者，應調離現職。\n教保服務人員涉有第十二條或第十三條情形，於調查期間，教保服務機構應予以暫時停聘、停職或停止契約執行；其原因消滅後復職者，未發給之薪資應依相關規定予以補發。\n前項情形，教保服務人員為準用教師法之公立幼兒園教師或適用公務人員相關法律者，其停聘、停職及原因消滅後復職本薪（年功薪）或本俸（年功俸）之補發，依各該法律規定辦理。"},
{no:"第十八條", body:"以現職教師身分任公立幼兒園園長者，其待遇、退休、撫卹、保險、福利及其他權益相關事項，準用教師待遇條例、公立學校教職員退休資遣撫卹條例、公教人員保險法及其他相關法規有關公立國民小學校長之規定。\n以現職契約進用之教保員身分任公立幼兒園園長者，其待遇、退休、保險、福利及其他權益相關事項之辦法，由中央主管機關定之。"},
{no:"第十九條", body:"公立幼兒園教師，其待遇、介聘、退休、撫卹、保險、福利及其他權益相關事項，準用教師待遇條例、國民中小學校長主任教師甄選儲訓及介聘辦法、公立學校教職員退休資遣撫卹條例、公教人員保險法及其他相關法規有關公立國民小學教師之規定。"},
{no:"第二十條", body:"公立幼兒園依勞動基準法相關規定以契約進用之教保員、助理教保員，其待遇及其他相關事項之辦法，由中央主管機關定之。"},
{no:"第二十一條", body:"公立托兒所改制為公立幼兒園後，原公立托兒所依公務人員任用法任用之人員及依雇員管理規則僱用之人員，於改制後繼續於原幼兒園任用或僱用者，其進修、俸給、保險、保障、結社、退休、撫卹、福利及其他權益相關事項，依其原適用之相關法令辦理。\n前項人員得依改制前原適用之組織法規，依規定辦理陞遷及銓敘審定。\n公立幼稚園、公立托兒所依幼照法改制為公立幼兒園，原依行政院與所屬中央及地方各機關約僱人員僱用辦法僱用之人員，其待遇、退休、福利及其他相關權益事項，依其原適用之相關法令規定辦理。"},
{no:"第二十二條", body:"私立教保服務機構教保服務人員之權益事項，依勞動基準法、性別工作平等法、勞工保險條例、就業保險法、勞工退休金條例、工會法、團體協約法、勞資爭議處理法、大量解僱勞工保護法及其他相關法規辦理。\n私立幼兒園教師之待遇、進修、研究、退休、撫卹、保險、教師組織，於中華民國一百年十二月三十一日以前已準用教師法相關規定者，仍依其規定辦理。"},
{no:"第二十三條", body:"各級主管機關應協助教保服務人員成立各級教保服務人員專業組織，協助其訂定工作倫理守則，並宣導、鼓勵教保服務人員依工會法組織及參與工會。\n為提升教保服務品質，教保服務機構應建立教保服務人員參與教保服務及員工權益重要事務決策之機制。"},
{no:"第二十四條", body:"教保服務機構應提供教保服務人員下列資訊：\n一、人事規章及相關工作權益。\n二、教保服務人員資格審核之結果。\n三、在職成長進修研習機會。\n四、參加教保服務人員組織權益。\n五、勞動權益。"},
{no:"第二十五條", body:"以現職教師身分任公立幼兒園園長者，其考核、解聘及其他管理相關事項，準用教育人員任用條例、公立高級中等以下學校校長成績考核辦法及其他相關法規有關公立國民小學校長之規定。\n以現職契約進用之教保員身分任公立幼兒園園長者，其考核、資遣及其他管理相關事項之辦法，由中央主管機關定之。\n公立學校附設幼兒園應置主任一人，由校長就幼兒園教師或教保員聘兼或為專任。\n公立幼兒園專任園長之遴選、聘任、聘期與公立學校附設幼兒園專任主任之任期及其他管理相關事項之自治法規，由直轄市、縣（市）主管機關定之。"},
{no:"第二十六條", body:"公立幼兒園教師，其聘任、考核、資遣、解聘、停聘、不續聘及其他管理相關事項，準用教師法、教育人員任用條例、公立高級中等以下學校教師成績考核辦法及其他相關法規有關公立國民小學教師之規定。"},
{no:"第二十七條", body:"公立幼兒園依勞動基準法相關規定以契約進用之教保員、助理教保員，其進用程序、考核及其他因地制宜等管理相關事項之辦法，由中央主管機關定之。"},
{no:"第二十八條", body:"公立托兒所改制為公立幼兒園後，原公立托兒所依公務人員任用法任用之人員及依雇員管理規則僱用之人員，於改制後繼續於原幼兒園任用或僱用者，其服務、懲戒、考績、訓練、資遣及其他管理相關事項，依其原適用之相關法令辦理。\n公立幼稚園、公立托兒所依幼照法改制為公立幼兒園，原依行政院與所屬中央及地方各機關約僱人員僱用辦法僱用之人員，其僱用期間、擔任工作內容與工作標準及其他管理相關事項，依其原適用之相關法令規定辦理。"},
{no:"第二十九條", body:"私立教保服務機構教保服務人員管理相關事項，以契約明定之。\n私立幼兒園教師之聘任、離職及資遣，於中華民國一百年十二月三十一日以前已準用教師法相關規定者，仍依其規定辦理。"},
{no:"第三十條", body:"教保服務人員、主任及組長依規定請假、留職停薪，或其他原因出缺之職務，教保服務機構應建立代理制度，由代理人代理之；情形特殊者，代理人資格得不受第三十二條第二項具教保服務人員資格規定之限制；其代理人之資格、薪資及其他相關事項，於本條例施行細則、第十八條第二項及第二十七條所定辦法定之。\n依前項規定進用之代理人，於調查期間停聘、停職或停止契約執行及停聘、停職或停止契約執行原因消滅後復職薪資之補發，依第十七條第三項及第四項規定辦理。"},
{no:"第三十一條", body:"公立幼兒園教保服務人員請假之辦法，由中央主管機關定之。\n私立教保服務機構教保服務人員之請假，依勞動基準法、性別工作平等法及勞工請假規則等相關規定辦理。"},
{no:"第三十二條", body:"教保服務機構不得以派遣方式進用教保服務人員。\n教保服務機構應進用具教保服務人員資格，且無第十二條、第十三條或第十四條第一項所列情形者，從事教保服務；未具教保服務人員資格者，不得在教保服務機構從事教保服務，但社區互助式及部落互助式教保服務實施辦法、職場互助式教保服務實施辦法另有規定者，從其規定。\n教保服務機構不得借用未在該機構服務之教保服務人員資格證書；教保服務人員資格證書不得提供或租借予他人使用。"},
{no:"第三十三條", body:"教保服務人員，不得對幼兒有身心虐待、體罰、霸凌、性騷擾、不當管教，或其他對幼兒之身心暴力或不當對待之行為。\n教保服務人員依第十五條通報直轄市、縣（市）主管機關，至遲不得超過二十四小時。\n直轄市、縣（市）主管機關知悉教保服務人員疑似有第十二條、第十三條、第十四條第一項各款及第一項情形後，應於二個工作日內，交由所設之委員會調查處理；另將調查處理結果以書面載明事實及理由，通知行為人及事件關係幼兒之法定代理人或實際照顧者。但公立學校附設幼兒園教師準用教師法之事項，依教師法及其相關規定辦理。\n前項委員會，應包括主管機關代表、具兒童保護意識之教保與兒童福利團體代表、教保服務人員團體代表、其他服務人員代表、家長團體代表及相關領域學者專家；其委員會組成、調查處理程序及其他相關事項之辦法，由中央主管機關定之。\n依本條例進行第三項調查時，行為人及教保服務機構其他相關之人，應配合調查。"},
{no:"第三十四條", body:"教保服務人員每年應參加教保專業知能研習十八小時以上；其實施辦法，由中央主管機關定之。\n教保服務機構新進用之教保服務人員，應於任職前二年內，或任職後三個月內，接受基本救命術訓練八小時以上；任職後每二年應接受性別平等及勞動權益相關課程各三小時以上、基本救命術訓練八小時以上、安全教育相關課程三小時以上及緊急救護情境演習一次以上。直轄市、縣（市）主管機關應至少每季辦理相關訓練、課程或演習，教保服務機構應予協助。\n前項任職後每二年之訓練時數，除性別平等相關課程外，得併入第一項教保專業知能研習時數計算。"},
{no:"第三十五條", body:"教保服務人員對幼兒資料應予保密。但經父母或監護人同意或依其他法律規定應予提供者，不在此限。"},
{no:"第三十六條", body:"各級主管機關為瞭解與規劃教保服務機構員額配置或人員進用，得蒐集、處理或利用教保服務人員之個人資料，並建立相關資料庫。"},
{no:"第三十七條", body:"教保服務人員表現優良者，直轄市、縣（市）主管機關應予獎勵；其獎勵事項、對象、種類、方式之自治法規，由直轄市、縣（市）主管機關定之。"},
{no:"第三十八條", body:"公立幼兒園教保服務人員之申訴或爭議處理，依下列規定辦理：\n一、園長：\n（一）以現職教師身分任園長者，準用教師法之規定。\n（二）以現職契約進用教保員身分任園長者，依勞動基準法、勞資爭議處理法及性別工作平等法之規定。\n二、教師：準用教師法之規定。\n三、依勞動基準法以契約進用之教保員、助理教保員：依勞動基準法、勞資爭議處理法及性別工作平等法之規定。\n四、前三款以外人員：依所進用各該法令之規定。"},
{no:"第三十九條", body:"私立教保服務機構教保服務人員之申訴或爭議處理，依勞動基準法、勞資爭議處理法及性別工作平等法之規定辦理。但中華民國一百年十二月三十一日以前已準用教師法相關規定之幼稚園教師，仍依其規定辦理。"},
{no:"第四十條", body:"教保服務人員違反第三十三條第一項規定，對幼兒有下列情形之一者，處行為人新臺幣六萬元以上六十萬元以下罰鍰，並公布行為人之姓名及機構名稱：\n一、身心虐待。\n二、情節重大之體罰、霸凌、性騷擾、不當管教、其他身心暴力或不當對待之行為。"},
{no:"第四十一條", body:"幼兒園有下列情形之一者，處負責人新臺幣六萬元以上三十萬元以下罰鍰，並令幼兒園限期改善，屆期仍未改善者，得按次處罰；其情節重大或經處罰三次後仍未改善者，得依情節輕重為一定期間減少招收人數、停止招生六個月至一年、停辦一年至三年或廢止設立許可之處分：\n一、違反第十二條至第十四條或第十七條第三項規定，知悉園內有不得於教保服務機構服務之教保服務人員而未依規定處理。\n二、違反第三十二條第一項規定，以派遣方式進用教保服務人員。\n三、違反第三十二條第二項規定，進用未具教保服務人員資格或有第十二條、第十三條、第十四條第一項所列情形者從事教保服務。\n四、違反第三十二條第三項規定，借用未在該園服務之教保服務人員資格證書。"},
{no:"第四十二條", body:"提供社區、部落或職場互助式教保服務之機構，有下列情形之一者，處負責人新臺幣六萬元以上三十萬元以下罰鍰，並令機構限期改善，屆期仍未改善者，得按次處罰；其情節重大或經處罰三次後仍未改善者，得依情節輕重為一定期間減少招收人數、停止招生六個月至一年、停辦一年至三年或廢止設立許可之處分：\n一、違反第十二條至第十四條或第十七條第三項規定，知悉機構內有不得於教保服務機構服務之教保服務人員而未依規定處理。\n二、違反第三十二條第一項規定，以派遣方式進用教保服務人員。\n三、違反第三十二條第二項規定，進用未具資格或有第十二條、第十三條、第十四條第一項所列情形者從事教保服務。\n四、違反第三十二條第三項規定，借用未在該機構服務之教保服務人員資格證書。"},
{no:"第四十三條", body:"教保服務機構違反第十六條第二項規定，未於聘任、任用或進用教保服務人員前辦理查詢，處負責人新臺幣五萬元以上二十五萬元以下罰鍰，並令教保服務機構限期改善，屆期仍未改善者，得按次處罰；必要時並得為令其停止招生或廢止設立許可之處分。\n教保服務人員違反第十五條規定，未依規定通報者，處新臺幣三萬元以上十五萬元以下罰鍰。"},
{no:"第四十四條", body:"行為人有下列情形之一者，處新臺幣三萬元以上十五萬元以下罰鍰，並得按次處罰：\n一、違反第三十二條第二項規定，未具資格，於教保服務機構從事教保服務。\n二、違反第三十二條第三項規定，提供或租借教保服務人員資格證書予他人使用。"},
{no:"第四十五條", body:"教保服務人員違反第三十五條規定者，處新臺幣三萬元以上十五萬元以下罰鍰，並得按次處罰。"},
{no:"第四十六條", body:"教保服務機構有下列情形之一者，處負責人新臺幣六千元以上六萬元以下罰鍰，並令教保服務機構限期改善，屆期仍未改善者，得按次處罰；其情節重大或經處罰三次後仍未改善者，得依情節輕重為一定期間減少招收人數、停止招生六個月至一年、停辦一年至三年或廢止設立許可之處分：\n一、違反依第十六條第四項所定辦法有關教保服務機構辦理認定、通報、資訊蒐集、任職前及任職期間查詢、處理及利用之強制或禁止規定。\n二、違反第五十一條第一項後段規定，以教保員或代理教師替代教師編制員額，其待遇未比照幼兒園園內教師辦理。\n三、教保服務機構之教保服務人員有違反第三十三條第一項規定之情形。\n教保服務人員違反第三十三條第一項規定，對幼兒有非屬情節重大之體罰、霸凌、性騷擾、不當管教、其他身心暴力或不當對待之行為，處行為人新臺幣六千元以上六萬元以下罰鍰，並公布行為人之姓名及機構名稱。\n行為人及教保服務機構其他相關之人，違反第三十三條第五項不配合調查，而無正當理由者，處新臺幣六千元以上六萬元以下罰鍰，並得按次處罰至其配合為止。"},
{no:"第四十七條", body:"教保服務機構有下列情形之一者，處負責人新臺幣三千元以上一萬五千元以下罰鍰，並令教保服務機構限期改善，屆期仍未改善者，得按次處罰；其情節重大或經處罰三次後仍未改善者，得依情節輕重為一定期間減少招收人數、停止招生六個月至一年、停辦一年至三年或廢止設立許可之處分：\n一、違反第六條第四項規定，拒不開立服務年資證明。\n二、違反第七條第三項規定，未將聘任之園長，報直轄市、縣（市）主管機關核定。\n三、違反第二十三條第二項規定，未建立教保服務人員參與教保服務及員工權益重要事務決策之機制。\n四、違反第二十四條規定，未提供教保服務人員相關資訊。\n五、違反第三十條第一項規定，未建立代理制度。"},
{no:"第四十八條", body:"教保服務人員有下列情形之一者，應令其限期改善，屆期仍未改善者，處新臺幣一千元以上六千元以下罰鍰，並得按次處罰：\n一、違反第三十四條第一項規定，每年未參加教保專業知能研習十八小時以上。\n二、違反第三十四條第二項規定，未於規定期限內接受基本救命術訓練八小時以上、性別平等、勞動權益及安全教育相關課程各三小時以上或緊急救護情境演習一次以上。\n教保服務人員有前項各款情形之一，係因不可歸責於教保服務人員之事由所致，並經查證屬實者，不予處罰。\n前項情形可歸責於教保服務機構者，應令教保服務機構限期改善，屆期仍未改善者，處負責人新臺幣一千元以上六千元以下罰鍰，並得按次處罰；其情節重大或經處罰三次後仍未改善者，得依情節輕重為一定期間減少招收人數、停止招生六個月至一年、停辦一年至三年或廢止設立許可之處分。"},
{no:"第四十九條", body:"本條例所定令限期改善及處罰，由直轄市、縣（市）主管機關為之；直轄市、縣（市）主管機關並得依行政罰法第十八條第二項規定辦理。\n教保服務機構違反本條例規定，經直轄市、縣（市）主管機關處以罰鍰、減少招收人數、停止招生、停辦或廢止設立許可者，直轄市、縣（市）主管機關應公布其名稱及負責人姓名。\n教保服務機構為法人，經直轄市、縣（市）主管機關廢止設立許可者，直轄市、縣（市）主管機關應通知法院令其解散。\n依第四十條、第四十六條第二項及第二項公布負責人、行為人、機構名稱者，其公布期間，由中央主管機關定之。"},

function highlight(text, term){
  if(!term) return text;
  const esc = term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return text.replace(new RegExp(esc,'gi'), m=>`<mark>${m}</mark>`);
}

/* ============================================================
   引用法規：自動從 QA 答案文字中偵測「第X條」並比對法規全文
   ============================================================ */
function toChineseNum(n){
  const d = ['','一','二','三','四','五','六','七','八','九'];
  if(n <= 10) return n===10 ? '十' : d[n];
  if(n < 20) return '十' + (n%10===0?'':d[n%10]);
  const tens = Math.floor(n/10), ones = n%10;
  return d[tens] + '十' + (ones===0?'':d[ones]);
}
function toArticleLabel(n, sub){
  return '第' + toChineseNum(n) + '條' + (sub ? '之' + toChineseNum(sub) : '');
}
const CATEGORY_LAW_PRIORITY = {
  "幼照法與人員條例": ["youzhao","tbc","feilib"],
};
function defaultPriorityFor(cat){
  return CATEGORY_LAW_PRIORITY[cat] || ["feilib","youzhao","tbc"];
}
function findArticle(lawKey, label){
  const lib = LAW_LIBRARY[lawKey];
  if(!lib) return null;
  const found = lib.data.find(a=>a.no===label);
  return found ? {lawKey, title:lib.title, no:found.no, body:found.body} : null;
}
function boldImportant(text){
  return text.split(/([，、；。\n])/).map(seg=>{
    if(/^[，、；。\n]$/.test(seg)) return seg;
    if(!seg) return seg;
    const isKeyClause = /[0-9一二三四五六七八九十百千萬]+\s*(?:年|月|日|小時|分鐘|次|人|元|條|款|項|級|個月|學年|學期|工作日|倍|分)/.test(seg)
      || /(應|不得|至遲|屆期|限期|終身|廢止|終止|解聘|免職|停職|停聘|按次處罰)/.test(seg);
    return isKeyClause ? `<strong>${seg}</strong>` : seg;
  }).join('');
}
function extractCitations(item){
  const re = /第(\d{1,3})條(之(\d{1,2}))?/g;
  const seen = new Set();
  const results = [];
  let m;
  while((m = re.exec(item.a)) !== null){
    const n = parseInt(m[1],10);
    const sub = m[3] ? parseInt(m[3],10) : null;
    const label = toArticleLabel(n, sub);
    const context = item.a.slice(Math.max(0, m.index-20), m.index);
    let priority = defaultPriorityFor(item.cat);
    if(context.includes('教保服務人員條例')) priority = ["tbc","youzhao","feilib"];
    else if(context.includes('幼照法') || context.includes('本法')) priority = ["youzhao","tbc","feilib"];
    else if(context.includes('辦法') || context.includes('本辦法')) priority = ["feilib","youzhao","tbc"];
    for(const key of priority){
      const found = findArticle(key, label);
      if(found){
        const dedupeKey = found.lawKey + found.no;
        if(!seen.has(dedupeKey)){
          seen.add(dedupeKey);
          results.push(found);
        }
        break;
      }
    }
  }
  return results.slice(0,3);
}
function renderCiteBlock(item){
  const cites = extractCitations(item);
  if(cites.length === 0) return '';
  const inner = cites.map(c=>`
    <div class="cite-item">
      <div class="cite-law">《${c.title}》${c.no}</div>
      <div class="cite-text">${boldImportant(c.body)}</div>
    </div>
  `).join('');
  return `<div class="qa-cite"><span class="qa-cite-label">引用法規：</span>${inner}</div>`;
}

// ---- 分類主選單 ----
function buildQaMenu(){
  const counts = {};
  CATS.forEach(c=> counts[c] = QA.filter(x=>x.cat===c).length);
  const allChip = `<button class="chip active" data-cat="全部" style="background:var(--teal);border-color:var(--teal);color:#fff;">全部<span class="n">${QA.length}</span></button>`;
  const catChips = CATS.map(c=>`<button class="chip" data-cat="${c}">${c}<span class="n">${counts[c]}</span></button>`).join('');
  qaMenuEl.innerHTML = `<div class="chip-wrap">${allChip}${catChips}</div>`;
  qaMenuEl.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeCat = btn.dataset.cat;
      inMenuMode = false;
      qaSearch.value = '';
      renderQAView();
    });
  });
}

// ---- 分類清單卡片 ----
function renderQaCards(items, term){
  qaCountEl.textContent = `共 ${items.length} 則`;
  qaEmptyEl.style.display = items.length ? 'none' : 'block';
  qaListEl.innerHTML = items.map((x,i)=>`
    <div class="qa-card" data-idx="${i}">
      <div class="qa-q">
        <span class="qa-tag">${x.cat}</span>
        <span class="qa-q-text">${highlight(x.q, term)}</span>
        <span class="qa-caret">▶</span>
      </div>
      <div class="qa-a">
        <p>${highlight(x.a, term)}</p>
        ${renderCiteBlock(x)}
        <div class="qa-actions">
          <span class="qa-src">資料來源：非營利幼兒園實施辦法／教育部國教署官方Q&A彙整</span>
          <div class="qa-actions-btns">
            <button class="copy-btn" data-copy-idx="${i}">📋 複製</button>
            <button class="copy-btn qa-inline-back">← 回到主選單</button>
          </div>
        </div>
      </div>
    </div>
  `).join('');
  qaListEl.querySelectorAll('.qa-q').forEach(el=>{
    el.addEventListener('click', ()=>{
      el.closest('.qa-card').classList.toggle('open');
    });
  });
  qaListEl.querySelectorAll('.qa-inline-back').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      qaBackBtn.click();
    });
  });
  qaListEl.querySelectorAll('.copy-btn[data-copy-idx]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const idx = parseInt(btn.dataset.copyIdx, 10);
      const item = items[idx];
      const text = `Q：${item.q}\nA：${item.a}`;
      navigator.clipboard.writeText(text).then(()=>{
        btn.textContent = '✅ 已複製';
        btn.classList.add('copied');
        setTimeout(()=>{ btn.textContent = '📋 複製'; btn.classList.remove('copied'); }, 1500);
      }).catch(()=>{
        btn.textContent = '複製失敗';
        setTimeout(()=>{ btn.textContent = '📋 複製'; }, 1500);
      });
    });
  });
}

// ---- 主渲染邏輯：搜尋優先於分類，否則依主選單／分類清單狀態顯示 ----
function renderQAView(){
  const term = qaSearch.value.trim();

  if(term){
    // 查詢可搜尋所有 QA，不受分類限制
    qaMenuEl.style.display = 'none';
    qaListWrapEl.style.display = 'block';
    qaBackBtn.style.display = 'inline-flex';
    const items = QA.filter(x=> (x.q+x.a+x.cat).toLowerCase().includes(term.toLowerCase()));
    renderQaCards(items, term);
    return;
  }

  if(inMenuMode){
    qaMenuEl.style.display = 'block';
    qaListWrapEl.style.display = 'none';
  } else {
    qaMenuEl.style.display = 'none';
    qaListWrapEl.style.display = 'block';
    qaBackBtn.style.display = 'inline-flex';
    const items = activeCat === "全部" ? QA : QA.filter(x=>x.cat===activeCat);
    renderQaCards(items, '');
  }
}

qaBackBtn.addEventListener('click', ()=>{
  inMenuMode = true;
  activeCat = "全部";
  qaSearch.value = '';
  renderQAView();
  window.scrollTo({top:0,behavior:'smooth'});
});

qaSearch.addEventListener('input', renderQAView);

buildQaMenu();
renderQAView();

  {name:"教保服務人員條例", desc:"共53條，111年6月29日修正公布。規範園長／教師／教保員／助理教保員之培育、資格、消極資格（解聘免職事由）、權益、管理、申訴及爭議處理。", url:"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=H0070071", source:"全國法規資料庫", group:"主要法規"},
];
const LAWLINKS = [...MAIN_LAWS_LINKS, ...SUBLAWS.map(s=>({...s, group:"子法／要點"}))];

const lawlinksListEl = document.getElementById('lawlinks-list');
const lawlinksCatsEl = document.getElementById('lawlinks-cats');
let activeLawlinksGroup = "全部";

function buildLawlinksCats(){
  const groups = ["全部","主要法規","子法／要點"];
  lawlinksCatsEl.innerHTML = groups.map(g=>{
    const n = g==="全部" ? LAWLINKS.length : LAWLINKS.filter(x=>x.group===g).length;
    const isMain = g==="主要法規";
    const activeStyle = (g===activeLawlinksGroup && isMain) ? 'style="background:var(--blue);border-color:var(--blue);color:#fff;"' : (isMain && g!==activeLawlinksGroup ? 'style="border-color:var(--blue);color:var(--blue);"' : '');
    return `<button class="chip ${g===activeLawlinksGroup?'active':''}" data-group="${g}" ${activeStyle}>${g}<span class="n">${n}</span></button>`;
  }).join('');
  lawlinksCatsEl.querySelectorAll('.chip').forEach(ch=>{
    ch.addEventListener('click', ()=>{
      activeLawlinksGroup = ch.dataset.group;
      buildLawlinksCats();
      renderLawlinks();
    });
  });
}

function renderLawlinks(){
  const items = activeLawlinksGroup==="全部" ? LAWLINKS : LAWLINKS.filter(x=>x.group===activeLawlinksGroup);
  lawlinksListEl.innerHTML = items.map(s=>`
    <div class="art-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
        <span class="art-num" style="background:${s.group==='主要法規'?'var(--blue)':'var(--teal)'};">${s.group}</span>
      </div>
      <div style="font-weight:700;color:var(--navy);font-size:15px;margin-top:8px;">${s.name}</div>
      <div class="art-body" style="margin-top:6px;">${s.desc}</div>
      <a href="${s.url}" target="_blank" rel="noopener" class="sublaw-link">前往${s.source}查看全文 →</a>
    </div>
  `).join('');
}
buildLawlinksCats();
renderLawlinks();
</script>
</body>
</html>
